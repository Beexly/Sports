apiVersion: apps/v1
kind: Deployment
metadata:
  name: gse-stealth-skeleton-gateway
  namespace: gse-intelligence
  labels:
    app.kubernetes.io/name: gse-stealth-skeleton-gateway
    app.kubernetes.io/version: "2.4.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gse-stealth-skeleton-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gse-stealth-skeleton-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: gateway
          image: ghcr.io/beexly/gse-stealth-skeleton-gateway:2.4.0
          ports:
            - containerPort: 8787
              name: http
          env:
            - name: OTEL_SERVICE_NAME
              value: "gse-stealth-skeleton-gateway"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.10"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8787
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 8787
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gse-stealth-skeleton-gateway-hpa
  namespace: gse-intelligence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gse-stealth-skeleton-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gse-stealth-skeleton-default-deny
  namespace: gse-intelligence
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gse-stealth-skeleton-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8787
  egress:
    - ports:
        - protocol: TCP
          port: 443
