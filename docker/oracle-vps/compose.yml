# Oracle Cloud Always-Free VPS stack — the $0 self-host box.
#
# Runs the free infrastructure that otherwise costs money:
#   - ncaa-api : self-hosted henrygd NCAA API (drops the public 5 req/sec cap)
#   - redis    : general-purpose Redis ($0, replaces Upstash/managed Redis).
#                NOTE: no application code reads REDIS_URL today, and `bullmq`
#                is installed nowhere in this repo. This is capacity for a
#                future queue, not a running one. See workers/README.md.
#   - ollama   : local OpenAI-compatible LLM for the internal-LLM tier ($0 inference)
#   - caddy    : reverse proxy with automatic Let's Encrypt TLS
#
# Setup + deploy: see README.md in this folder. Configure via .env (copy .env.example).
# The app (on Vercel) then points at this box:
#   HENRYGD_NCAA_BASE_URL=https://ncaa.<your-domain>
#   INTERNAL_LLM_BASE_URL=https://llm.<your-domain>/v1   (or keep Ollama private; see README)

name: sports-vps

services:
  ncaa-api:
    image: ghcr.io/henrygd/ncaa-api:latest
    container_name: sports_ncaa_api
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sports_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: sports_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    # First run: `docker exec sports_ollama ollama pull llama3.1` (or a smaller model for the ARM box).

  caddy:
    image: caddy:2-alpine
    container_name: sports_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # Protects the LLM endpoint with HTTP basic auth (generate with `caddy hash-password`).
      LLM_BASICAUTH_USER: ${LLM_BASICAUTH_USER:-internal}
      LLM_BASICAUTH_HASH: ${LLM_BASICAUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ncaa-api
      - ollama

  # ── Standalone workers (aspirational — NOT a queue, NOT currently working) ──
  # Dockerfiles live under workers/<name>/Dockerfile (context = repo root).
  # Add DATABASE_URL + any worker-specific vars to .env before bringing up.
  #
  # These are NOT consumers of a job queue: there is no BullMQ anywhere in this
  # repo. They are `setTimeout` loops and run-once stubs. This is also the ONLY
  # compose file that references them — docker/docker-compose.yml (the dev
  # stack) does not. Production scheduling is 21 Vercel crons in
  # apps/web/vercel.json.
  #
  # KNOWN BROKEN: every CMD below is `npx ts-node --esm src/index.ts`, which
  # fails on Node 20 with ERR_UNKNOWN_FILE_EXTENSION, and the data-refresh
  # deps stage never copies packages/stats-api/package.json despite
  # @sports/stats-api being a declared dependency. Fix both before `up`.
  # Full inventory and the open delete/keep/wire-up decision: workers/README.md.

  worker-data-refresh:
    build: { context: ../.., dockerfile: workers/data-refresh/Dockerfile }
    container_name: sports_worker_data_refresh
    restart: unless-stopped
    env_file: ./.env
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      HENRYGD_NCAA_BASE_URL: "http://ncaa-api:3000"
    depends_on: [redis, ncaa-api]

  worker-pick-generation:
    build: { context: ../.., dockerfile: workers/pick-generation/Dockerfile }
    container_name: sports_worker_pick_generation
    # Run-once stub (pick generation is integrated into worker-data-refresh); it
    # exits 0 immediately, so restart:"no" avoids an infinite restart loop.
    # Switch back to unless-stopped when this becomes a long-running worker.
    restart: "no"
    env_file: ./.env
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    depends_on: [redis]

  worker-content-publishing:
    build: { context: ../.., dockerfile: workers/content-publishing/Dockerfile }
    container_name: sports_worker_content_publishing
    # Run-once kill-switch stub (auto-publish is disabled; main() logs and exits);
    # restart:"no" avoids an infinite restart loop. Switch back to unless-stopped
    # when this becomes a long-running consumer.
    restart: "no"
    env_file: ./.env
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    depends_on: [redis]

volumes:
  redis_data:
  ollama_data:
  caddy_data:
  caddy_config:
