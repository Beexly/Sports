chedule%2C%20Pompano%20simulcasts%20racing%20from%20all%20across%20North%20America%20on%20a%20daily%20basis%20which%20means%20regulars%20can%20wager%20on%20races%20all%20day%2C%20every%20day%20for%20all%20but%20two%20days%20of%20the%20year.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtAs%20well%20as%20harness%20and%20thoroughbred%20racing%2C%20the%20simulcast%20offering%20includes%20greyhound%20racing%20from%20over%2020%20venues%20as%20well%20as%20jai-alai%20games%20from%20noon%20to%20midnight%2C%20or%20from%2010AM%20for%20special%20events.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtLike%20most%20successful%20tracks%20in%20the%20States%2C%20Pompano%20Park%20is%20these%20days%20operated%20as%20a%20%E2%80%9Cracino%E2%80%9D%20with%20slot%20machines%20providing%20the%20bulk%20of%20the%20venture%E2%80%99s%20revenue%20as%20well%20as%20hosting%20live%20poker%20games.%20Some%20of%20the%20track%E2%80%99s%20revenue%20goes%20back%20into%20the%20community%20too%2C%20Pompano%20Park%20being%20a%20donor%20to%20Our%20Father%E2%80%99s%20House%20Soup%20Kitchen%20in%20Pompano%20Beach%20which%20is%20to%20their%20great%20credit.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtThe%20track%20sits%20in%20a%20great%20location%20just%208%20miles%20from%20downtown%20Fort%20Lauderdale%2C%20less%20than%2040%20miles%20from%20Miami%20Beach%20and%20within%20easy%20reach%20of%20two%20international%20airports.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3Ch2%3E%5Cr%5Cn%5Ct%5Ct%20Pompano%20Park%20History%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5Ct%20Pompano%20Park%20have%20been%20racing%20since%201964%20in%20their%20beautiful%20South%20Florida%20location%20which%20has%20become%20a%20favorite%20for%20trainers%20and%20drivers%2C%20seeing%20top%20action%20from%20both%20trotters%20and%20pacers.%20Back%20then%20the%20track%20was%20the%20brainchild%20of%20Frederick%20van%20Lennep%20who%20oversaw%20operations%20right%20up%20until%20his%20death%20in%201987.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtBefore%20that%20however%2C%20an%20original%20track%20at%20Pompano%20stood%20on%20the%20same%20site%20having%20been%20built%20back%20in%201926%20with%20the%20grand%20opening%20taking%20place%20on%20Christmas%20Day%20with%20huge%20crowds%20coming%20in%20to%20the%20area%20for%20the%20event.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtRacing%20had%20to%20cease%20for%20a%20little%20while%20however%20after%20the%20Florida%20Governor%20branded%20those%20in%20charge%20of%20the%20track%20%E2%80%9Claw%20breakers%E2%80%9D%20(as%20pari-mutuel%20betting%20was%20illegal%20back%20then).%20Further%20damage%20was%20caused%2C%20this%20time%20literally%2C%20in%201928%20when%20a%20hurricane%20devastated%20the%20area%20and%20the%20site%20became%20dormant%20until%201953.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtVan%20Lennep%20though%20bought%20the%20land%20and%20envisaged%20a%20new%20track%20in%20the%20area%20and%20having%20balloted%20successfully%20in%201962%20to%20have%20pari-mutuel%20betting%20made%20legal%2C%20his%20dream%20was%20finally%20to%20be%20realised.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3Ch2%3E%5Cr%5Cn%5Ct%5Ct%20Pompano%20Park%20Track%20Details%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5Ct%20A%20standard%205%2F8%20mile%20dirt%20oval%20harness%20track%20is%20in%20situ%20at%20Pompano%20Park%2C%20the%20surface%20proving%20a%20popular%20one%20with%20drivers%20and%20trainers%20alike.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3Ch2%3E%5Cr%5Cn%5Ct%5Ct%20Address%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5Ct%20777%20Isle%20of%20Capri%20Circle%2C%20Pompano%20Beach%2C%20FL%2033069%2C%20USA%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3Ch2%3E%5Cr%5Cn%5Ct%5Ct%20Contact%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5Ct%20Aaron%20Feinberg%20(aaron.feinberg%40islecorp.com)%5Cr%5Cn%3C%2Fp%3E%22%2C%22raceTrackHubPHI%22%3A%22%3Cp%3E%5Cr%5Cn%5Ct%3C%2Fp%3E%3Ch2%3E%5Cr%5Cn%5Ct%5CtAbout%20Parx%20Racing%3C%2Fh2%3E%5Cr%5Cn%5CtFormerly%20known%20as%20Philadelphia%20Park%2C%20Parx%20Casino%20and%20Racing%20is%20not%20just%20a%20thoroughbred%20 ng%20when%20it%20hosts%20the%20%24200%2C000%20Pennsylvania%20Governer%E2%80%99s%20Cup%20Handicap%2C%20a%20five-furlong%20sprint%20race%20on%20turf%20however%20the%20jewel%20in%20the%20crown%20now%20is%20the%20Penn%20Mile%2C%20run%20since%202013.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtThe%20Penn%20Mile%20is%20a%20Grade%202%20event%20on%20the%20turf%20for%20the%20three-year-olds%2C%20held%20each%20June%20and%20worth%20approximately%20%24500%2C000.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3Ch2%3E%5Cr%5Cn%5Ct%5CtPenn%20National%20History%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5CtThe%20history%20of%20this%20great%20track%20stretches%20back%20to%201972%20when%20the%20track%20raced%20for%20the%20first%20time%20in%20front%20of%20over%2010%2C000%20people%20on%20August%2030.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtPenn%20National%20had%20been%20the%20brainchild%20of%20a%20bunch%20of%20civic%20leaders%20from%20Central%20Pennsylvania%20who%20managed%20to%20establish%20the%20track%20very%20early%20with%20100%20racing%20dates%20in%20the%20first%20year%20alone%20%E2%80%93%20this%20is%20closer%20to%20200%20these%20days.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtBack%20in%20%E2%80%9983%2C%20Penn%20was%20instrumental%20in%20the%20invention%20of%20telephone%20betting%2C%20i.e.%20%E2%80%9Caccount%20wagering%E2%80%9D%20which%20went%20on%20to%20be%20a%20well%20practiced%20way%20of%20betting%20until%20the%20internet%20age%20took%20hold.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtPenn%20National%20became%20a%20public%20company%20in%201994%20when%20offering%20%2418million%20worth%20of%20stock%20on%20the%20NASDAQ%2C%20something%20which%20has%20helped%20the%20business%20grow%20over%20the%20last%2020-something%20years%20and%20has%20resulted%20in%20the%20track%20being%20able%20to%20host%20such%20races%20as%20the%20half-million%20dollar%20Penn%20Mile.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtAs%20well%20as%20providing%20a%20place%20for%20people%20in%20Pennsylvania%20to%20come%20and%20 5Cr%5Cn%5Ct%3Ch2%3E%5Cr%5Cn%5Ct%5CtAbout%20Delta%20Downs%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5Cr%5Cn%5CtKnown%20as%20%E2%80%9CAmerica%E2%80%99s%20Favorite%20Nighttime%20Track%E2%80%9D%2C%20Delta%20Downs%20is%20the%20premier%20racing%20circuit%20in%20Louisiana%20with%5Cr%5Cn%5Ctstabling%20for%201%2C200%20horses%20on%20its%20plush%20240-acre%20property.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtAs%20a%20modern%2C%20all-encompassing%20resort%2C%20Delta%20Downs%20Racetrack%20Casino%20%26%20Hotel%20aims%20to%20capture%20the%20spirit%20and%20charm%20of%20New%5Cr%5Cn%5CtOrleans%20with%20its%20mix%20of%20quarter%20horse%20and%20thoroughbred%20racing%2C%20live%20entertainment%2C%20disparate%20food%20and%5Cr%5Cn%5Ctdrink%20choices%20and%20off-track%20betting%2C%20a%20lot%20of%20which%20is%20housed%20in%20its%20comfortable%20enclosed%20grandstand.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtHorseplayers%20come%20into%20Delta%20Downs%20from%20Baton%20Rouge%20and%20New%20Orleans%20which%20are%20a%20few%20hours%20away%20to%20the%20east%20and%2C%20although%5Cr%5Cn%5Ctproud%20of%20its%20Louisiana%20heritage%20and%20roots%2C%20Delta%20Downs%20is%20only%2010%20minutes%20away%20from%20the%20Texas%20border%5Cr%5Cn%5Ctalong%20the%20I-10%20and%20is%20in%20fact%20only%20an%20hour-and-a-half%20from%20Houston%20opening%20it%20up%20to%20a%20lot%20of%20out%20of%20state%5Cr%5Cn%5Ctclientele.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3Ch2%3E%5Cr%5Cn%5Ct%5CtDelta%20Downs%20History%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5Cr%5Cn%5CtDelta%20Downs%20started%20life%20as%20a%20Quarter%20Horse%20track%20after%20Lee%20Berwick%20decided%20he%20needed%20somewhere%20other%20than%20his%20farm%20to%20run%5Cr%5Cn%5Ctsuch%20races.%20For%20the%20uninitiated%3B%20Quarter%20Horses%20are%20specifically%20an%20American%20breed%20which%20excels%20over%5Cr%5Cn%5Ctshort%20distances.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtThat%20was%20back%20in%201973%20and%20once%20open%20the%20track%20hosted%20both%20Quarter%20Horse%20and%20Thoroughbred%20racing%20and%20was%20so%20successful%20that%5Cr%5Cn%5Ctby%20the%20%E2%80%9890%E2%80%99s%20it%20was%20sold%20for%20%2410million.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtAfter%20law%20was%20passed%20allowing%20slot%20machines%20at%20Delta%20however%20the%20track%20was%20sold%20on%20again%20soon%20after%2C%20this%20time%20for%20a%20huge%5Cr%5Cn%5Ct%24100%20million%20and%2C%20somewhat%20cruelly%20considering%20the%20owners%20invested%20more%20than%20%24120%20million%20in%20improvements%5Cr%5Cn%5Ctat%20the%20site%2C%20was%20damaged%20in%202005%20by%20Hurricane%20Rita.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtAfter%20being%20closed%20for%20months%20after%20the%20hurricane%20Delta%20recovered%20and%2C%20much%20like%20at%20Delaware%20and%20other%20places%20these%20days%2C%5Cr%5Cn%5Ctthe%20new%20found%20revenue%20from%20its%20slots%20and%20casino%20games%20allowed%20the%20track%20to%20improve%20racing%20on%20the%20track.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtThe%20winter%20program%20as%20it%20is%20now%20has%20helped%20the%20careers%20of%20several%20high%20quality%20horses%20in%20recent%20times%2C%20for%20example%202016%20Delta%5Cr%5Cn%5CtJackpot%20Stakes%20winner%20Exaggerator%20which%20went%20on%20to%20win%20the%20Santa%20Anita%20Derby%2C%20the%20Haskell%20Invitational%5Cr%5Cn%5Ctand%20over%20%243.5million%20in%20prize%20money.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3Ch2%3E%5Cr%5Cn%5Ct%5CtDelta%20Downs%20Track%20Details%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5Cr%5Cn%5CtThe%20surface%20at%20Delta%20Downs%20is%20an%20interesting%20one%3B%20it%20has%20a%20limestone%20base%20with%20a%20mixture%20on%20top%20of%20clay%20and%20sand%20from%20the%5Cr%5Cn%5Ctnearby%20Sabine%20River%20which%20helps%20to%20give%20this%20venue%20a%20real%20sense%20of%20place.%20The%20track%20is%20a%20six%20furlong%5Cr%5Cn%5Ctoval%20with%20an%20additional%20mile%20chute.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtDelta%20can%20test%20the%20balance%20of%20a%20horse%20with%20its%2010%25%20incline%20on%20the%20turns%20and%20a%20quick%20home%20stretch%20of%20660%20yards%20long%20and%2080%5Cr%5Cn%5Ctfeet%20wide.%20The%20safety%20limit%20at%20the%20track%20is%2010%20horses.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3Ch2%3E%5Cr%5Cn%5Ct%5CtBiggest%20Races%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5Cr%5Cn%5Ct%3Cp%3E%5Cr%5Cn%5Ct%5CtDelta%20Jackpot%20Stakes%20%E2%80%93%20two-year-olds%2C%20%E2%80%8B%201%5Cr%5Cn%5Ct%5Ct%3Csup%3E%5Cr%5Cn%5Ct%5Ct%5Ct1%5Cr%5Cn%5Ct%5Ct%3C%2Fsup%3E%5Cr%5Cn%5Ct%5Ct%E2%81%84%5Cr%5Cn%5Ct%5Ct%3Csub%3E%5Cr%5Cn%5Ct%5Ct%5Ct16%5Cr%5Cn%5Ct%5Ct%3C%2Fsub%3E%5Cr%5Cn%5Ct%5Ctmiles%20(November)%5Cr%5Cn%5Ct%5Ct%3Cbr%3E%20Delta%20Princess%20Stakes%20%E2%80%93%20two-year-old%20fillies%2C%201%20mile%20(November)%5Cr%5Cn%5Ct%3C%2Fp%3E%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%5Cr%5Cn%3Ch2%3E%5Cr%5Cn%5CtAddress%5Cr%5Cn%3C%2Fh2%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct2717%20Delta%20Downs%20Drive%2C%20Vinton%2C%20LA%2070668%2C%20USA.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%5Cr%5Cn%3Ch2%3E%5Cr%5Cn%5CtContact%5Cr%5Cn%3C%2Fh2%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtChris%20Warren%20(chriswarren%40boydgaming.com)%5Cr%5Cn%3C%2Fp%3E%22%2C%22raceTrackHubFP%22%3A%22%3Cp%3E%5Cr%5Cn%5Ct%3C%2Fp%3E%3Ch2%3E%5Cr%5Cn%5Ct%5Ct%3Cspan%20style%3D%5C%22font-family%3A%20Arial%3B%5C%22%3E%EF%BB%BF%3C%2Fspan%3EAbout%20FanDuel%20Sportsbook%20and%20Horse%20Racing%3C%2Fh2%3E%5Cr%5Cn%5CtCollinsville%20is%20home%20to%20thoroughbred%20racing%20venue%20FanDuel%20Sportsbook%20and%20Horse%20Racing%2C%20an%20area%20in%20Illinois%20but%20actually%20only%2015%20minutes%20from%20downtown%20St%20Louis%2C%20Missouri.%20The%20track%20also%20used%20to%20host%20standardbred%20harness%20racing%2C%20though%20that%20was%20shelved%20back%20in%201999%20as%20management%20concentrated%20on%20thoroughbreds.%5Cr%5Cn%3Cp%3E%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtSimulcast%20wagering%20is%20offered%20at%20the%20site%20in%20order%20for%20bettors%20to%20punt%20on%20tracks%20all%20across%20the%20country%2C%20while%20FanDuel%20Sportsbook%20and%20Horse%20Ra gh%20as%20the%20track%20is%20still%20going%20strong.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3C%2Fp%3E%3Ch2%3E%5Cr%5Cn%5Ct%5CtFanDuel%20Sportsbook%20and%20Horse%20Racing%20Track%20Details%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5CtThere%20is%20a%20one-mile%20dirt%20oval%20at%20FanDuel%20Sportsbook%20and%20Horse%20Racing%20with%20chutes%20for%20both%20six%20furlong%20and%20ten%20furlong%20races.%20No%20turf%20track%20exists%20at%20the%20facility.%5Cr%5Cn%3Cp%3E%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3C%2Fp%3E%3Ch2%3E%5Cr%5Cn%5Ct%5CtWager%20At%20FanDuel%20Sportsbook%20and%20Horse%20Racing%20With%20TVG!%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5CtNow%20you%20know%20all%20about%20the%20Illinois%20track%2C%20don%E2%80%99t%20forget%20you%20can%20wager%20on%20races%20there%20with%20TVG.%20Head%20to%20our%20%3Ca%20href%3D%5C%22https%3A%2F%2Fwww.tvg.com%2Fraces%5C%22%3Eschedules%20page%3C%2Fa%3E%20to%20check%20out%20the%20latest%20race%20times%20then%20bet%20and%20watch%20live!%5Cr%5Cn%3Cp%3E%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3C%2Fp%3E%3Ch2%3E%5Cr%5Cn%5Ct%5CtAddress%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5Ct9301%20Collinsville%20Rd%2C%20Collinsville%2C%20IL%2062234%2C%20USA%5Cr%5Cn%3Cp%3E%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3C%2Fp%3E%3Ch2%3E%5Cr%5Cn%5Ct%5CtContact%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5Ctinfo%40fairmountpark.com%5Cr%5Cn%3Cp%3E%3C%2Fp%3E%5Cr%5Cn%22%2C%22raceTrackHubFL%22%3A%22%3Cp%3E%5Cr%5Cn%5Ct%3Ch2%3E%5Cr%5Cn%5Ct%5CtAbout%20Finger%20Lakes%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5CtNew%20York%20is%20a%20competitive%20place%20when%20it%20comes%20to%20thoroughbred%20racing%2C%20but%20Finger%20Lakes%20is%20seen%20as%20Western%20New%20York%E2%80%99s%20home%20for%20the%20sport.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtGiven%20its%20home%20in%20the%20picturesque%20Finger%20Lakes%20region%2C%20along%20with%20its%20wineries%20and%20terrific%20scenery%2C%20the%20track%20plays%20host%20to%20many%20tourists%20as%20well%20as%20some%20fiercely%20loyal%20locals%20on%20around%20160%20race%20days%20every%2 dstand%20leading%20to%20much%20higher%20attendances%20and%20revenues.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtA%20notable%20horse%20attached%20to%20Finger%20Lakes%20was%20Tin%20Cup%20Chalice%20who%20was%20the%20first%20winner%20of%20the%20Big%20Apple%20Triple%2C%20a%20series%20of%20races%20at%20Belmont%20and%20Saratoga%20as%20well%20as%20here.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5CtTin%20Cup%20Chalice%20was%20based%20at%20Finger%20Lakes%20and%20was%20considered%20a%20local%20equine%20hero%2C%20but%20was%20also%20unfortunately%20killed%20at%20the%20track%20during%20training%20in%202009%20when%20a%20colt%20called%20Zany%2C%20tragically%20well%20named%2C%20bolted%20before%20bumping%20into%20him%20with%20both%20horses%20destroyed%20in%20the%20incident.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3Ch2%3E%5Cr%5Cn%5Ct%5CtFinger%20Lakes%20Track%20Details%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5CtThe%20main%20track%20is%20a%20one-mile%20oval%20with%20a%20quick%20960%20feet%20run-in.%20There%20is%20no%20turf%20track%20at%20Finger%20Lakes%20but%20this%20takes%20nothing%20away%20from%20the%20entertainment%20provided.%5Cr%5Cn%3C%2Fp%3E%5Cr%5Cn%3Cp%3E%5Cr%5Cn%5Ct%3Ch2%3E%5Cr%5Cn%5Ct%5CtBiggest%20Races%5Cr%5Cn%5Ct%3C%2Fh2%3E%5Cr%5Cn%5CtWandsworth%20Memorial%20Handicap%20%E2%80%93%20three-year-olds%20and%20over%2C%201%201%2F8%20miles%20(July%204%3Csup%3Eth%3C%2Fsup%3E).%5Cr%5Cn%5Ct%3Cbr%2F%3E%5Cr%5Cn%5Ct%20New%20York%20Derby%20%E2%80%93%20three-year-olds%20(New%20York%20bred%20only)%2C%201%201%2F16%20miles%20(July).%5Cr%5Cn%5Ct%3Cbr%2F%3E%5Cr%5Cn%5Ct%20New%20York%20Oaks%20%E2%80%93%20three-year-old%20fillies%20(New%20York%20bred)%2C%201%201%2F16%20miles%20(July).%5Cr%5Cn%5Ct%3Cbr%2F%3E%5Cr%5Cn%5Ct%20New%20York%20Breeders%E2%80%99%20Futurity%20%E2%80%93%20two-year-olds%20(New%20York%20bred)%2C%206%20furlongs%20(September).%5Cr%5Cn%5Ct%3Cbr%2F%3E%5Cr%5Cn%5Ct%20Lady%20Fingers%20Stakes%20%E2%80%93%20two-year-old%20fillies%20(New%20York%20bred)%2C%206%20furlongs%20(September).%5Cr%5Cn
