ealth of information about each team's performance. These include:</span></p><ul><li><p><span style=\"font-size: 11pt;\"><strong>Wins: </strong></span><span style=\"font-size: 11pt;\">The count of games a team has won.</span></p></li><li><p><span style=\"font-size: 11pt;\"><strong>Losses:</strong></span><span style=\"font-size: 11pt;\"> The count of games a team has lost.</span></p></li><li><p><span style=\"font-size: 11pt;\"><strong>Win Percentage</strong></span><span style=\"font-size: 11pt;\">: The ratio of wins to total games played, expressed as a decimal.</span></p></li><li><p><span style=\"font-size: 11pt;\"><strong>Points For: </strong></span><span style=\"font-size: 11pt;\">The total points a team has scored.</span></p></li><li><p><span style=\"font-size: 11pt;\"><strong>Points Against</strong></span><span style=\"font-size: 11pt;\">: The total points a team has conceded.</span></p></li></ul><p></p><p><span style=\"font-size: 11pt;\">The college football standings are updated after each game, ensuring you always have the most recent information. With DraftKings Sportsbook, you'll stay informed about the current college football standings and your favorite team's path to the playoff all season long.</span></p><p></p><p><span style=\"font-size: 11pt;\"><strong>Factors Affecting College Football Standings</strong></span></p><p></p><p><span style=\"font-size: 11pt;\">Numerous factors influence college football standings and college football power rankings. By understanding these, you can glean valuable insights into who will ultimately make the College Football Playoff. We'll examine the role of wins and losses, tiebreakers, and the significance of conference matchups in determining the college football standings.</span></p><p></p><p><span style=\"font-size: 11pt;\">With so few games in the college football regular season, a single loss can remove a team from contention in their conference and the College Football Playoff. Only the ACC, Big 12, Big Ten and SEC champions are guaranteed a spot in the College Football Playoff so any other team will need to have the best overall resume to make the playoffs.</span></p><p></p><p><span style=\"font-size: 11pt;\">The Sun Belt is the only conference with divisions where each divisional winner will make the conference championship game. In every other conference, the two teams with the best conference record will make the conference championship game. In the event of a tie at the top of the standings, tiebreakers such as head-to-head records, overall records and other factors will be used.</span></p><p></p><p><span style=\"font-size: 11pt;\">Conference matchups shape who will make the conference championship games and therefore, the College Football Playoff. It is important to track the conference standings throughout the season to know who has an edge to make the postseason. DraftKings Sportsbook provides extensive coverage of current college football standings and a variety of betting options to enrich your college football viewing experience.</span></p>","_metadata":{"uid":"cse1bfe657dcfbc079"}}}]},"created_at":"2024-07-09T14:32:17.566Z","created_by":"blt745c348ffc9b905a","disable_nighthawk_odds_cards":false,"h1_options":{"logo":null,"paragraph":"","show_contentstack_card_first":false,"enable_short_header":false},"league_name":"","name":"Standings","odds_cards":[{"title":"COLLEGE FOOTBALL STANDINGS","_metadata":{"uid":"cs33c7a84704cca756"},"link":{"title":"","href":""},"open_link_in_new_tab":false}],"tags":[],"title":"College Football Standings","type":"Standings","type_settings":{"custom_rich_text":"","title":"","source_prod":"","source_test":"","history_subtype":null},"updated_at":"2024-09-16T19:12:49.972Z","updated_by":"blt745c348ffc9b905a","url":"standings","publish_details":{"time":"2024-09-16T19:14:00.782Z","user":"blt745c348ffc9b905a","environment":"blte15008cc851a58fb","locale":"en-us"}},"blt38258361e0e05046":{"_version":2,"locale":"en-us","uid":"blt38258361e0e05046","ACL":{},"_in_progress":false,"content":{"content_blocks":[{"freeform":{"title":"Understanding NFL Standings","custom_rich_text":"<p>To fully grasp NFL standings and NFL power rankings, there are several key points to consider. We'll unpack how these standings are determined, the meaning of the different columns, and their update frequency.</p><p>Current NFL standings are primarily based on teams' win-loss records throughout the regular season. The team's performance in their respective divisions and conferences significantly influences their position in the NFL standings. More victories mean a higher standing in NFL power rankings; conversely, more losses typically mean a lower standing in the NFL power rankings.</p><p>The various columns in the NFL standings represent a wealth of information about each team's performance. These include:</p><ul><li><strong>Wins:</strong> The count of games a team has won.</li><li><strong>Losses:</strong> The count of games a team has lost.</li><li><strong>Ties</strong>: The number of games that ended in a stalemate.</li><li><strong>Win Percentage:</strong> The ratio of wins to total games played, expressed as a decimal.</li><li><strong>Points For: </strong>The total points a team has scored.</li><li><strong>Points Against: </strong>The total points a team has conceded.</li></ul><p>The NFL standings are updated after each game, ensuring you always have the most recent information. With DraftKings Sportsbook, you'll stay informed about the current NFL standings and your favorite teams' performance throughout the season.</p><h3>Factors Affecting NFL Standings</h3><p>Numerous factors influence NFL standings, NFL power rankings and NFL playoff standings. By understanding these, you can glean valuable insights into team positioning and playoff prospects. We'll examine the role of wins and losses, tiebreakers, and the significance of divisional and conference matchups in determining football NFL standings.</p><p>Wins and losses form the basis of NFL standings, determining team positioning within divisions, conferences, and the overall league. More wins can boost a team's chances of making the playoffs, while losses can hinder progress, affecting both NFL power rankings and NFL playoff standings.</p><p>Tiebreakers come into effect when teams share a win-loss record. These rules, such as head-to-head record, divisional record, conference record, and strength of schedule, help determine team order within divisions, conferences, and NFL standings.</p><p>Divisional and conference matchups can greatly impact NFL standings and NFL playoff standings. Wins in these games can significantly boost a team's playoff chances. Understanding these factors helps fans and bettors to make informed decisions. DraftKings Sportsbook provides extensive coverage of current NFL standings and a variety of betting options to enrich your NFL experience.</p>","_metadata":{"uid":"cs8bbc78cd2d9a0de8"}}}]},"created_at":"2024-04-29T15:30:25.318Z","created_by":"blt745c348ffc9b905a","h1_options":{"logo":null,"paragraph":"","show_contentstack_card_first":false,"enable_short_header":false},"league_name":"","name":"Standings","odds_cards":[{"title":"NFL STANDINGS","_metadata":{"uid":"cs8fd9f31ffe6bf274"},"link":{"title":"","href":""},"open_link_in_new_tab":false}],"tags":[],"title":"NFL Standings","type":"Standings","type_settings":{"custom_rich_text":"","title":"","source_prod":"","source_test":"","history_subtype":null},"updated_at":"2024-05-16T17:43:19.945Z","updated_by":"blt745c348ffc9b905a","url":"standings","publish_details":{"environment":"blte15008cc851a58fb","locale":"en-us","time":"2025-04-24T14:31:55.640Z","user":"blt745c348ffc9b905a"}},"blt1d1a44f4f22bc3fd":{"_version":5,"locale":"en-us","uid":"blt1d1a44f4f22bc3fd","ACL":{},"_in_progress":false,"content":{"content_blocks":[]},"created_at":"2021-06-30T03:41:07.020Z","created_by":"blt4412b88cf4f71f4a","h1_options":{"logo":null,"paragraph":"<p><br /></p>","show_contentstack_card_fi l},"updated_at":"2023-04-14T14:00:08.740Z","updated_by":"blt745c348ffc9b905a","url":"bracket","publish_details":{"environment":"blte15008cc851a58fb","locale":"en-us","time":"2023-08-30T20:42:03.396Z","user":"blt745c348ffc9b905a"}},"bltdda530a0b4f5e72d":{"_version":13,"locale":"en-us","uid":"bltdda530a0b4f5e72d","ACL":{},"_in_progress":false,"content":{"content_blocks":[{"freeform":{"title":"About the March Madness Bracket","custom_rich_text":"<p>The NCAA Men's Basketball Tournament March Madness bracket is released every March with 68 teams making the field to compete for a National Championship. Every Division 1 school that wins its conference championship game (pending certain rules) gets an automatic bid into the tournament, and the rest of the field is filled with at-large bids. Teams are seeded 1-16 in four different brackets throughout different regions of the country.</p>\n<p>The first games that take place are the “First Four,” where we have four games between 11-seeds and 16-seeds to compete for the final four spots in the field. Once the field is down to 64 teams, the bracket is set, and you can begin to fill out your picks. The first round of the tournament always begins on a Thursday afternoon following Selection Sunday. Just prior to those Thursday tip-offs is generally when brackets lock.</p>","_metadata":{"uid":"csef3249ae7a9273c8"}}}]},"created_at":"2021-06-30T16:00:46.653Z","created_by":"blt4412b88cf4f71f4a","h1_options":{"logo":null,"paragraph":"<p><br></p>","show_contentstack_card_first":true},"league_name":"","name":"Bracket","odds_cards":[{"title":"MARCH MADNESS BRACKET","_metadata":{"uid":"cse22b722fe6036355"},"link":{"title":"","href":""},"open_link_in_new_tab":false}],"tags":[],"title":"Final Four Bracket","type":"ISG Iframe","type_settings":{"custom_rich_text":"","title":"March Madness Bracket","source_prod":"https://dk-statshub-web.isportgenius.com.au/college-basketball/mens/bracket-without-navigation","source_test":"https://dk-statshub-webdev.isportgenius.com.au/college-basketball/mens/bracket-without-navigation","history_subtype":null},"updated_at":"2023-03-27T13:50:55.905Z","updated_by":"blt745c348ffc9b905a","url":"bracket","publish_details":{"environment":"blte15008cc851a58fb","locale":"en-us","time":"2024-04-01T21:22:00.345Z","user":"blt745c348ffc9b905a"}},"bltf066492a58854d8c":{"_version":7,"locale":"en-us","uid":"bltf066492a58854d8c","ACL":{},"_in_progress":false,"content":{"content_blocks":[]},"created_at":"2022-12-02T16:15:16.176Z","created_by":"blt745c348ffc9b905a","h1_options":{"logo":null,"paragraph":"","show_contentstack_card_first":false},"league_name":"","name":"Prop Bets","odds_cards":[{"title":"SUPER BOWL PROP BETS","_metadata":{"uid":"cs660ee934c675ce17"},"link":{"title":"","href":""},"open_link_in_new_tab":false}],"tags":[],"title":"Super Bowl Prop Bets","type":"Custom","type_settings":{"custom_rich_text":"<p><em>Looking for Super Bowl prop bets? Check out our </em><a href=\"https://sportsbook.draftkingstest.com/super-bowl-prop-bets\" target=\"_self\"><em>Super Bowl Prop Bets page</em></a><em> and start placing bets on props including coin toss, Gatorade color, and more!*</em></p><p><em>*props available are dependent on the jurisdiction you are located in</em></p><h2><br/>Common Super Bowl Prop Bets</h2><p>There might be only one game to bet on at the end of the football season, but by no means is there a shortage of potential plays for the Super Bowl. On top of the spread, game total or simply backing your team on the moneyline, there’s a litany of props available.</p><p>Player Props are the most common among the options you’ll find. These can range from game-long options like yardage props and touchdowns scored to very specific plays — the total yardage on a player’s longest rush, the total yardage on a player’s first reception or even which player will score the game’s first touchdown. Of course, bettors can also back who they believe will be named Super Bowl MVP.</p><p>But for those looking to broaden things, Team Props and Game Props are options. Instead of betting on the game total, bettors can simply back one team to go over or under their individual total for the Super Bowl. But, there are still ways to get in on even more specific outcomes, including some options bettors won’t see throughout the regular season — whether or not the opening kickoff will be a touchback, will any team successfully recover an onside kick and will there be a flea-flicker attempted being among the potential plays.</p><p>The Super Bowl Props don’t end there, though. Have a strong feeling about the Gatorade color that’ll be dumped on the winning coach’s head? There’s a prop for that. Do you believe “tails never fails” — or perhaps the opposite? There’s a prop bet for the opening coin toss. And be on the lookout for cross-sport bets, too!</p>","title":"","source_prod":"","source_test":"","history_subtype":null},"updated_at":"2023-02-01T19:53:53.543Z","updated_by":"blt745c348ffc9b905a","url":"prop-bets","publish_details":{"environment":"blte15008cc851a58fb","locale":"en-us","time":"2023-02-06T15:17:01.860Z","user":"blt745c348ffc9b905a"}},"blt080623df18e5ab3f":{"_version":2,"locale":"en-us","uid":"blt080623df18e5ab3f","ACL":{},"_in_progress":false,"content":{"content_blocks":[]},"created_at":"2021-06-30T03:43:50.767Z","created_by":"blt4412b88cf4f71f4a","h1_options":{"logo":null,"paragraph":"","show_contentstack_card_first":false},"league_name":"","name":"Standings","odds_cards":[{"title":"NBA FINALS STANDINGS","link":{"title":"","href":""},"open_link_in_new_tab":false,"_metadata":{"uid":"csf9873dfd292289b9"}}],"tags":[],"title":"NBA Finals Standings","type":"Standings","type_settings":{"custom_rich_text":"","title":"","source_prod":"","source_test":"","history_subtype":null},"updated_at":"2022-11-21T20:13:36.746Z","updated_by":"blt745c348ffc9b905a","url":"standings","publish_details":{"environment":"blte15008cc851a58fb","locale":"en-us","time":"2024-03-05T21:43:4 "<p>UFC 265 Fight Card</p>","show_contentstack_card_first":false},"name":"Fight Card","odds_cards":[],"tags":[],"title":"UFC 265 Fight Card","type":"Fight Card","type_settings":{"custom_rich_text":"","title":"","source_prod":"","source_test":"","history_subtype":null},"updated_at":"2021-07-14T13:43:26.623Z","updated_by":"blt745c348ffc9b905a","url":"fight-card","publish_details":{"environment":"blte15008cc851a58fb","locale":"en-us","time":"2021-07-29T19:03:31.495Z","user":"blt745c348ffc9b905a"}},"blt247d63bec708e51a":{"_version":1,"locale":"en-us","uid":"blt247d63bec708e51a","ACL":{},"_in_progress":false,"content":{"content_blocks":[]},"created_at":"2021-06-30T19:20:21.672Z","created_by":"blt4412b88cf4f71f4a","h1_options":{"logo":null,"paragraph":"","show_contentstack_card_first":false},"name":"2021 Masters Picks","odds_cards":[],"tags":[],"title":"Masters Picks","type":"Custom","type_settings":{"custom_rich_text":"<p style=\"text-align: left;\"><em>By Geoff Ulrich | March 11th, 2021</em><br></p>\n<p style=\"text-align: left;\"><br></p>\n<p style=\"text-align: left;\">The 2021 Masters is now only a month or so away. Yes, that last sentence is correct, a MONTH. It seems like only yesterday (four months actually) that Dustin Johnson was waxing the field to the tune of a five-shot win – a win which resulted in him breaking the all-time Masters scoring record and hitting 20-under par. The previous record was held by Jordan Spieth and Tiger Woods.</p>\n<p style=\"text-align: left;\"><br></p>\n<p style=\"text-align: left;\">This year’s event will take place between April 8-11 and <a href=\"http://dkng.co/DKSBContent\" target=\"_blank\"><strong>DraftKings Sportsbook</strong></a> already has odds up for the event. There will also be tons of great options for daily fantasy purposes on DraftKings too, but for now, let's focus on the odds and see where everyone’s at and who might be looking like a good futures target for some early investments.</p>\n<p style=\"text-align: left;\"><br></p>\n<p style=\"text-align: left;\"><strong>The Favorites</strong></p>\n<p></p>\n<p style=\"text-align: left;\"><a href=\"http://dkng.co/DKSBContent\" target=\"_blank\"><strong>Dustin Johnson</strong></a> remains the favorite as of writing at +550. It’s an incredibly small number, especially considering DJ was going off around +1000 pre-event when he won the Masters last fall. The outright favorites here don’t have a great record of coming through, though, and we haven’t seen a repeat winner here since Tiger Woods in 2001-2002.</p>\n<p style=\"text-align: left;\"><br></p>\n<p style=\"text-align: left;\">Behind him, there’s a big group of players all bunched tightly together in the odds. <a href=\"http://dkng.co/DKSBContent\" target=\"_blank\"><strong>Rory McIlroy and Justin Thomas</strong></a> both sit at +1000 while <a href=\"http://dkng.co/DKSBContent\" target=\"_blank\"><strong>Jon Rahm</strong></a> sits just behind at +1100. All three men are still looking for their first green jacket and could conceivably challenge this year. All three have had ebbs and flows to start the year and all three are winless in 2021 as of the creation of this article — although Rory is in the mix at the API so that could change quickly.</p>\n<p style=\"text-align: left;\"><br></p>\n<p style=\"text-align: left;\"><a href=\"http://dkng.co/DKSBContent\" target=\"_blank\"><strong>Bryson DeChambeau and Brooks Koepka</strong></a> have also been bet down to very low numbers for this event and both sit at +1200. DeChambeau was the betting favorite at Augusta National in the fall and famously quipped that the course was playing like a par 67 for him — before finishing T34. Koepka’s odds have taken a huge turn lower after picking up a win at Phoenix in February. If you bet him in January or earlier for this event you’re sitting with some good value right now. Koepka’s finished T7 and T2 at this event over the past two seasons.</p>\n<p style=\"text-align: left;\"><br></p>\n<p style=\"text-align: left;\"><strong>Betting Targets (<a href=\"http://dkng.co/DKSBContent\" target=\"_blank\">DraftKings Sportsbook</a>)</strong></p>\n<p></p>\n<p style=\"text-align: left;\"><strong><a href=\"http://dkng.co/DKSBContent\" target=\"_blank\">Patrick Cantlay +2500</a></strong></p>\n<p style=\"text-align: left;\"><br></p>\n<p style=\"text-align: left;\">Cantlay’s been on a serious roll of form over the past four to five months and it feels like he’s still not getting the proper respect in the betting odds. The American has moved up to No. 7 in the OWGR and has now finished T17 or better in each of his past six PGA TOUR starts. This year, he’s posted a third-place finish at Pebble Beach (where he led the field in SG: Tee to Green stats) and a second-place finish at the American Express, where he shot a brilliant 61 in the final round. The past five winners at Augusta have all posted at least one top-5 finish or better in the preceding three months leading up to the event and have also all been ranked inside the top 25 in the OWGR. Cantlay fits both those trends nicely. While I like the idea of taking both Cantlay and Xander Schauffele (+1800) in this range, Cantlay for me is the clear better value right now as there’s not much separating these two in form. This will be his fifth time playing Augusta and he’s finished T17 and T9 the past two seasons.</p>\n<p style=\"text-align: left;\"><br></p>\n<p style=\"text-align: left;\"><strong><a href=\"http://dkng.co/DKSBContent\" target=\"_blank\">Paul Casey +4500</a></strong></p>\n<p style=\"text-align: left;\"><br></p>\n<p style=\"text-align: left;\">While Casey has often disappointed us in the big events, I can’t stop coming back to him in this range. The Englishman seems to be defying age as 2021 is setting up to be his best start to a competitive season in quite some time. Casey already picked up a win in January over in Dubai (Euro Tour) and also has two top 10s in two PGA TOUR starts as of the time of writing. Even his putting has looked improved in 2021, so if he can maintain his form with that club then he should have a real shot at grabbing his first major. Casey was a co-leader at Augusta after the first round last season (he opened with a 65) and has four top-15 finishes at Augusta over his past six trips there. In this range, there’s no one with a better mix of course history and current form for me to target.</p>\n<p style=\"text-align: left;\"><br></p>\n<p style=\"text-align: left;\"><strong>Longshot (<a href=\"http://dkng.co/DKSBContent\" target=\"_blank\">DraftKings Sportsbook</a>)</strong></p>\n<p></p>\n<p style=\"text-align: left;\"><strong><a href=\"http://dkng.co/DKSBContent\" target=\"_blank\">Marc Leishman +10000</a></strong></p>\n<p style=\"text-align: left;\"><br></p>\n<p style=\"text-align: left;\">Leishman has been all over the map in terms of play over the past four to five months. He endured a terrible run of form last fall but righted himself with a T13 at Augusta in November. The top-15 finish represented his third top-15 finish at the event in his past seven tries. He’s been up near the lead on multiple occasions at Augusta and even held the 36-hole lead back at the 2018 Masters. The Aussie has shown better form with his irons in 2021, gaining 1.0 strokes or more on his approaches in four of his six PGA TOUR starts. We often see him go off at +6600 or lower in majors so his price really stands out, especially considering the decent start he’s had to 2021. If you’re looking for a player to invest in at bigger odds, he’s the best value on the board for me at +10000 or greater.</p>\n<p style=\"text-align: left;\"><br></p>\n<p style=\"text-align: left;\"><em>I am a promoter at DraftKings and am also an avid fan and user (my username is wavegoodbye) and may sometimes play on my personal account in the games that I offer advice on. Although I have expressed my personal view on the games and strategies above, they do not necessarily reflect the view(s) of DraftKings and I may also deploy different players and strategies than what I recommend above. I am not an employee of DraftKings and do not have access to any non-public information.</em></p>","title":"","source_prod":"","source_test":"","history_subtype":null},"updated_at":"2021-06-30T19:20:21.672Z","updated_by":"blt4412b88cf4f71f4a","url":"picks","publish_details":{"environment":"blte15008cc851a58fb","locale":"en-us","time":"2022-02-07T21:41:36.877Z","user":"blt745c348ffc9b905a"}},"blt5fe707c391626954":{"_version":1,"locale":"en-us","uid":"blt5fe707c391626954","ACL":{},"_in_progress":false,"content":{"content_blocks":[]},"created_at":"2021-06-30T19:19:22.037Z","created_by":"blt4412b88cf4f71f4a","h1_options":{"logo":null,"paragraph":"","show_contentstack_card_first":false},"name":"Participants","odds_cards":[],"tags":[],"title":"Masters Participants","type":"Custom","type_settings":{"custom_rich_text":"<p>This list details the qualification criteria for the 2021 Masters Tournament and the players who qualified under them; any additional criteria under which players qualified is indicated in parentheses.</p>\n<p>1. All past winners of the Masters Tournament</p><ul><li>Fred Couples</li><li>Sergio García&nbsp;</li><li>Trevor Immelman</li><li>Dustin Johnson</li><li>Zach Johnson</li><li>Bernhard Langer</li><li>Sandy Lyle</li><li>Phil Mickelson</li><li>Larry Mize</li><li>José María Olazábal</li><li>Patrick Reed</li><li>Charl Schwartzel</li><li>Adam Scott</li><li>Vijay Singh</li><li>Jordan Spieth</li><li>Bubba Watson</li><li>Mike Weir</li><li>Danny Willett</li><li>Ian Woosnam</li></ul><ul><li><em>Past winners not expected to play: Tommy Aaron, Jack Burke Jr., Ángel Cabrera, Charles Coody, Ben Crenshaw, Nick Faldo, Raymond Floyd, Bob Goalby, Jack Nicklaus, Mark O'Meara, Gary Player, Craig Stadler, Tom Watson, Tiger Woods,&nbsp;Fuzzy Zoeller</em></li></ul>\n<p>2. Recent winners of the U.S. Open (2016–2020)</p><ul><li>Bryson DeChambeau</li><li>Brooks Koepka&nbsp;</li><li>Gary Woodland&nbsp;</li></ul>\n<p>3. Recent winners of The Open Championship (2016–2020)</p><ul><li>Shane Lowry&nbsp;</li><li>Francesco Molinari</li><li>Henrik Stenson</li></ul>\n<p>4. Recent winners of the PGA Championship (2016–2020)</p><ul><li>Collin Morikawa</li><li>Justin Thomas&nbsp;</li><li>Jimmy Walker</li></ul>\n<p>5. Recent winners of the The Players Championship (2018–2021)</p><ul><li>Rory McIlroy</li><li>Webb Simpson</li></ul>\n<p>6. The winner of the gold medal at the Olympic Games</p>\n<p>7. The winner and runner-up in the 2020 U.S. Amateur Championship</p><ul><li>Ollie Osborne&nbsp;</li><li>Tyler Strafaci&nbsp;</li></ul>\n<p>8. The winner of the 2020 Amateur Championship</p><ul><li>Joe Long&nbsp;</li></ul>\n<p>9. The winner of the 2020 Asia-Pacific Amateur Championship</p>\n<p>10. The winner of the 2021 Latin America Amateur Championship</p>\n<p>11. The winner of the 2020 U.S. Mid-Amateur Golf Championship</p>\n<p>12. The leading twelve players, and those tying for twelfth place, from the 2020 Masters Tournament</p><ul><li>Corey Conners</li><li>Dylan Frittelli</li><li>Im Sung-jae&nbsp;</li><li>Pan Cheng-tsung</li><li>Jon Rahm</li><li>Cameron Smith</li></ul>\n<p>13. The leading four players, and those tying for fourth place, in the 2020 U.S. Open</p><ul><li>Harris English</li><li>Louis Oosthuizen</li><li>Matthew Wolff</li></ul>\n<p>14. The leading four players, and those tying for fourth place, in the 2020 Open Championship</p>\n<p>15. The leading four players, and those tying for fourth place, in the 2020 PGA Championship</p><ul><li>Paul Casey (18)</li><li>Jason Day (18)</li><li>Tony Finau (17,18)</li><li>Scottie Scheffler (17,18)</li></ul>\n<p>16. Winners of PGA Tour events&nbsp;from the originally scheduled date of the 2020 Masters Tournament (April 9, 2020) to the start of the 2021 tournament</p><ul><li>Daniel Berger (17,18)</li><li>Patrick Cantlay</li><li>Stewart Cink</li><li>Brian Gay</li><li>Jim Herman</li><li>Max Homa</li><li>Viktor Hovland</li><li>Kim Si-woo</li><li>Jason Kokrak</li><li>Martin Laird</li><li>Kevin Na</li><li>Carlos Ortiz</li><li>Xander Schauffele</li><li>Robert Streb</li><li>Hudson Swafford</li><li>Michael Thompson</li></ul>\n<p>17. All players who qualified for the 2020 Tour Championship</p><ul><li>Abraham Ancer</li><li>Cameron Champ</li><li>Lanto Griffin</li><li>Tyrrell Hatton</li><li>Billy Horschel</li><li>Mackenzie Hughes</li><li>Kevin Kisner&nbsp;</li><li>Marc Leishman&nbsp;</li><li>Hideki Matsuyama</li><li>Sebastián Muñoz</li><li>Joaquín Niemann</li><li>Ryan Palmer</li><li>Brendon Todd</li></ul>\n<p>18. The leading 50 players on the Official World Golf Ranking as of December 31, 2020</p><ul><li>Christiaan Bezuidenhout</li><li>Matthew Fitzpatrick</li><li>Tommy Fleetwood</li><li>Matt Kuchar</li><li>Victor Perez</li><li>Ian Poulter</li><li>Justin Rose</li><li>Matt Wallace</li><li>Lee Westwood</li><li>Bernd Wiesberger</li></ul>\n<p>19. The leading 50 players on the Official World Golf Ranking as of April 5, 2021</p>\n<p>20. Invited International players (TBD)</p>","title":"","source_prod":"","source_test":"","history_subtype":null},"updated_at":"2021-06-30T19:19:22.037Z","updated_by":"blt4412b88cf4f71f4a","url":"participants","publish_details":{"environment":"blte15008cc851a58fb","locale":"en-us","time":"2022-02-07T21:41:36.877Z","user":"blt745c348ffc9b905a"}},"blt7d03cfeab6745e37":{"_version":1,"locale":"en-us","uid":"blt7d03cfeab6745e37","ACL":{},"_in_progress":false,"created_at":"2021-06-30T03:39:50.805Z","created_by":"blt4412b88cf4f71f4a","h1_options":{"logo":null,"paragraph":"","show_contentstack_card_first":false},"name":"Info","odds_cards":[],"snippets_cards":[],"snippets_header":"","tags":[],"title":"Masters Info","type":"Custom","type_settings":{"custom_rich_text":"<p>The Masters Tournament takes place April 8th-11th at the Augusta National&nbsp;Golf Club in Augusta, Georgia, USA.</p>\n<p>The Par 72 course is a total of 7475 Yards</p>\n<p>First played in 1934, the 85th Edition of the Masters is the first major of the calendar year and sees the Masters return to it's normal April timeslot, following a postponed event in 2020 due to the Coronavirus Pandemic.</p>\n<p><br>Dustin Johnson is the defending champion, having won by 5 strokes at -20, earning the $2M purse in the process. Im Sung-Jae of South Korea and Cameron Smith of Australia tied for 2nd at 15 under.&nbsp;</p>","title":"","source_prod":"","source_test":"","history_subtype":null},"updated_at":"2021-06-30T03:39:50.805Z","updated_by":"blt4412b88cf4f71f4a","url":"info","publish_details":{"environment":"blte15008cc851a58fb","locale":"en-us","time":"2022-02-07T21:41:36.877Z","user":"blt745c348ffc9b905a"}},"blt48a754b5c457a86a":{"_version":1,"locale":"en-us","uid":"blt48a754b5c457a86a","ACL":{},"_in_progress":false,"created_at":"2021-06-30T03:26:58.406Z","created_by":"blt4412b88cf4f71f4a","h1_options":{"logo":null,"paragraph":"","show_contentstack_card_first":false},"name":"Stats","odds_cards":[],"snippets_cards":[],"snippets_header":"","tags":[],"title":"UFC 264 Stats","type":"ISG Iframe","type_settings":{"custom_rich_text":"","title":"Detailed Stats","source_prod":"https://dkweb.isportgenius.com.au/preview/1007501860?theme=dark","source_test":"","history_subtype":null},"updated_at":"2021-06-30T03:26:58.406Z","updated_by":"blt4412b88cf4f71f4a","url":"stats","publish_details":{"environment":"blte15008cc851a58fb","locale":"en-us","time":"2021-07-01T19:42:38.831Z","user":"blt4412b88cf4f71f4a"}},"bltdeb39ece89ce7801":{"_version":1,"locale":"en-us","uid":"bltdeb39ece89ce7801","ACL":{},"_in_progress":false,"created_at":"2021-06-30T03:25:15.790Z","created_by":"blt4412b88cf4f71f4a","h1_options":{"logo":null,"paragraph":"","show_contentstack_card_first":false},"name":"Competitor History","odds_cards":[],"snippets_cards":[],"snippets_header":"","tags":[],"title":"UFC 264 Competitor History","type":"History","type_settings":{"custom_rich_text":"","title":"","source_prod":"","source_test":"","history_s
