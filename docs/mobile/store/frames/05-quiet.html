<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>05-quiet</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 430px; height: 932px; overflow: hidden;
    background: #08090C; color: #EDE8E0;
    font-family: Inter, -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen { width: 430px; height: 932px; position: relative; display: flex; flex-direction: column; }
  .top { padding: 54px 24px 0; display: flex; align-items: center; gap: 10px; }
  .eyebrow { font-size: 12px; letter-spacing: 1.9px; text-transform: uppercase; color: #9AA8E8; font-weight: 600; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 24px; }
  .panel {
    width: 100%; border: 1px solid #23262E; border-radius: 14px;
    background: #12141A; padding: 22px;
  }
  .caption { font-size: 31px; line-height: 36px; font-weight: 600; letter-spacing: -0.5px; }
  .body { margin-top: 10px; font-size: 15px; line-height: 22px; color: #C4BFB6; }
  .rule { height: 1px; background: #23262E; margin: 18px 0; }
  .meta { font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: #8F8A82; }
  .num { font-variant-numeric: tabular-nums; font-weight: 700; color: #EDE8E0; }
  .bottom { padding: 0 24px 62px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; }
  .row { display: flex; gap: 22px; align-items: baseline; }
  .bar { height: 6px; border-radius: 3px; background: rgba(196,191,182,.16); overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 6px; border-radius: 3px; background: #FF4D2E; }
  .pill {
    display: inline-block; border: 1px solid rgba(196,191,182,.45); border-radius: 3px;
    padding: 2px 8px; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #C4BFB6;
  }
  .pill.ember { border-color: rgba(255,77,46,.45); color: #FF4D2E; }
  .pill.iris { border-color: rgba(154,168,232,.5); color: #9AA8E8; }
</style></head>
<body><div class="screen">
  <div class="top">
    <svg width="22" height="22" viewBox="0 0 64 64" fill="none">
<circle cx="32" cy="32" r="27" stroke="#3A3F4B" stroke-width="2"/>
<ellipse cx="32" cy="32" rx="27" ry="10" stroke="#EDE8E0" stroke-width="1.8"
         opacity=".5" transform="rotate(-24 32 32)"/>
<path d="M53 21.5 A27 27 0 0 1 46 52" stroke="#EDE8E0" stroke-width="5"/>
<circle cx="32" cy="32" r="7" fill="#EDE8E0"/>
<circle cx="10" cy="40" r="3.5" fill="#FF4D2E"/>
</svg>
    <span class="eyebrow">Galaxy Sports Edge</span>
  </div>

  <div class="stage">
    <div class="panel">
      <div class="meta">Quiet days</div>
      <div class="caption" style="margin-top:12px">Some days there is nothing.</div>
      <div class="body">We tell you that too.</div>
      <div class="rule"></div>
      <div class="body">The engine ran and did not find an edge it could stand behind.
      That is the product working as designed.</div>
      <div class="rule"></div>
      <div class="meta">Quiet slate</div>
    </div>
  </div>

  <div class="bottom">
    <div class="foot">
      <span class="meta">Frame 5 of 6</span>
      <span class="meta">We detect. You decide.</span>
    </div>
  </div>
</div></body></html>
