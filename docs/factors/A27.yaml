id: A27
title: Referee crew penalty rate to totals (A3 extended)
hypothesis: A discover-era referee crew identified by an extreme game-total over/under rate keeps that lean out of sample, and the lean's direction is consistent with that crew's penalty-yardage rate.
estimand: validate-era total-over-rate residual (pp) for the discover-era most-extreme-|effect| referee, Bonferroni over crews tested (same selection rule as A3)
unit: percentage points of over-rate
data: [nflverse.schedules, nflverse.pbp]
discover_era: 2009-2019
validate_era: 2020-2025
kill_line: "validate-era |effect| for the discover-selected crew <= 0 in the discover direction, or the Bonferroni-adjusted 95% CI includes 0, with n >= 30 validate games for that crew"
mde_80pct_power: null
script: scripts/factors/A27.mjs
status: UNTESTED
number: null
ci: null
n: null
run_sha: null
run_at: null
blocked_on: null
notes: >
  C-408. Pre-registered 2026-09-15 per LAST_PLAN.md section 4.3 (A27), reusing
  A3's exact crew-selection and Bonferroni-adjustment method (games.csv
  referee field, not the full nflverse officials release, since A3 already
  validated that join works and games.csv already carries spread_line/
  total_line/result/total) rather than restating it. Extension beyond A3:
  each crew's average total penalty yards per game (pbp penalty_yards summed
  by game_id) is computed and reported alongside the over-rate residual in
  notes, as the "penalty rate" half of the estimand — a secondary, reported
  correlation, never the kill line itself, since A3 already found crew
  home/under leans DEAD at this sample size and the honest expectation here
  is DEAD too. Data: nfldata games.csv + nflverse pbp (CC BY 4.0), local
  cache; no DB.
