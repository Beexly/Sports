id: A28
title: Rookie receiver week-N breakout cohort curve
hypothesis: Rookie WR/TE drafted on Day 1-2 (rounds 1-3) show larger in-season target-share growth (early weeks to late weeks) than Day 3 picks (rounds 4-7).
estimand: (late-season minus early-season target share) for round<=3 rookies minus the same delta for round>=4 rookies, validate-era rookie seasons, cluster-robust by player
unit: percentage points of target share
data: [nflverse.draft_picks, nflverse.player_stats]
discover_era: 2017-2019
validate_era: 2020-2024
kill_line: "validate-era round<=3 minus round>=4 growth-delta <= 0 or 95% CI includes 0 with n >= 100 rookie-seasons"
mde_80pct_power: null
script: scripts/factors/A28.mjs
status: UNTESTED
number: null
ci: null
n: null
run_sha: null
run_at: null
blocked_on: null
notes: >
  C-409. Pre-registered 2026-09-15 per LAST_PLAN.md section 4.3 (A28). Rookie
  season = player_stats season equals draft_picks season (entry_year proxy;
  nflverse draft_picks has no separate entry_year field, season IS the draft
  year). WR/TE only. Early = weeks 1-6, late = weeks 12-17 of the rookie's
  draft-year season, each player's own target_share mean in that window
  (>=2 games each window required). Growth = late mean - early mean. Primary:
  CR1 mean(growth | round<=3) - CR1 mean(growth | round>=4), validate era.
  Data: nflverse draft_picks + player_stats (CC BY 4.0), local cache; no DB.
