[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "galaxy-sports-edge"
version = "2026.11.15"
description = "Galaxy Sports Edge 5-Vertical Autonomous Prediction, Props, SGP, DFS & Fantasy Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "pulp>=2.7.0",
]

[project.optional-dependencies]
engine = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "temporalio>=1.7.0",
    "boto3>=1.34.0",
    "fire>=0.6.0",
    "magika>=0.5.0",
    "langextract>=0.1.0",
    "arize-otel>=0.6.0",
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
gse = "gse_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gse_engine"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["gse_engine"]
