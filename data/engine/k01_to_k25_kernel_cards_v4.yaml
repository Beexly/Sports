    - 0.0
    - 0.025
    bm_shrinkage_factor:
    - 0.0
    - 1.0
  computational_complexity: O(1) standalone; O(d^2) pairwise anti-cannibalization scan
  overfit_failure_modes:
  - Plug-in Kelly overbetting noisy 80%-confidence tail projections (causing confidence-inversion drawdowns).
