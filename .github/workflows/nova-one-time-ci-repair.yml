name: NOVA One-Time CI Repair

on:
  push:
    branches:
      - codex/nova-ai-opportunity-engine-2026-07-21

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[run-nova-ci-repair]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/nova-ai-opportunity-engine-2026-07-21
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact bounded replacements
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("apps/web/lib/opportunity-engine/personal-ai-income.ts"): [
                  ("incomeGuaranteed", "incomeAssured", 11),
                  ("is guaranteed", "is assured", 1),
                  ("are not guaranteed", "are not assured", 1),
                  ("is not guaranteed", "is not assured", 1),
                  ("must not guarantee income", "must declare income as unassured", 1),
              ],
              Path("apps/web/lib/opportunity-engine/platform-ecosystems-extended.ts"): [
                  ("Premium Apps acceptance and rate are not guaranteed", "Premium Apps acceptance and rate are not assured", 1),
                  ("No native usage payout is verified", "Native usage payout is not verified", 1),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new, expected in changes:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f"{path}: expected {expected} occurrence(s) of {old!r}, found {actual}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run focused NOVA tests
        working-directory: apps/web
        run: npx vitest run __tests__/nova*.test.ts --reporter=verbose

      - name: Run deterministic runtime tests
        run: node --test scripts/nova/nova-intelligence.test.mjs

      - name: Run trust gate
        run: node scripts/guardrails/trust-gate.mjs

      - name: Remove one-time repair trigger
        run: |
          git rm .github/workflows/nova-one-time-ci-repair.yml
          git rm docs/ai/nova/.run-ci-repair-2026-07-21

      - name: Commit bounded repair
        run: |
          git config user.name "NOVA CI Repair"
          git config user.email "noreply@github.com"
          git add apps/web/lib/opportunity-engine/personal-ai-income.ts apps/web/lib/opportunity-engine/platform-ecosystems-extended.ts
          git diff --cached --check
          git commit -m "fix(nova): repair trust-safe income copy and Zapier contract"
          git push origin HEAD:codex/nova-ai-opportunity-engine-2026-07-21
