name: Nightly Content Draft

# Drafts a content post for today's slate via Claude, runs the semantic
# reviewer, writes both into _drafts/, and opens a PR for an operator to
# approve. This workflow does NOT publish anything. The PR is the gate;
# operator merge is the action.
#
# Hard Rule §6 (no auto-publish): the workflow opens a PR and stops.
# An operator must review the draft and click merge before anything ships.

on:
  schedule:
    - cron: "0 8 * * *"  # 08:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-content
  cancel-in-progress: false

jobs:
  draft-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Draft + review
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/draft-nightly-content.mjs
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Open PR with the draft
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          branch: nightly-content/${{ github.run_id }}
          base: main
          title: "[draft] Nightly content for ${{ steps.draft.outputs.date }}"
          body: |
            Auto-generated draft and semantic review attached.

            **Operator action required.** Merge happens only when you click it.
            Review the draft and the `.review.json` verdict, then merge
            only if approved. If `verdict: REJECT`, do not merge — open
            an issue and rework the prompt.

            Generated by `.github/workflows/nightly-content.yml`.
          labels: |
            content
            draft-only
            needs-operator-review
          add-paths: |
            _drafts/
          delete-branch: true
