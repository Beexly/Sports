name: Nightly Content Draft

# Drafts a content post for today's slate via Claude, runs the semantic
# reviewer, writes both into _drafts/, and opens a PR for an operator to
# approve. This workflow does NOT publish anything. The PR is the gate;
# operator merge is the action.
#
# Hard Rule §6 (no auto-publish): the workflow opens a PR and stops.
# An operator must review the draft and click merge before anything ships.

on:
  schedule:
    - cron: "0 8 * * *"  # 08:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-content
  cancel-in-progress: false

jobs:
  draft-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Draft + review
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NIGHTLY_SPORT: ${{ vars.NIGHTLY_SPORT }}
        run: |
          node scripts/draft-nightly-content.mjs
          DATE=$(date -u +%Y-%m-%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "telemetry_path=_drafts/${DATE}-nightly.telemetry.json" >> "$GITHUB_OUTPUT"
          echo "review_path=_drafts/${DATE}-nightly.review.json" >> "$GITHUB_OUTPUT"

      - name: Build self-documenting PR body
        id: pr_body
        if: success()
        run: |
          TELE='${{ steps.draft.outputs.telemetry_path }}'
          REV='${{ steps.draft.outputs.review_path }}'
          {
            echo 'body<<EOF_PR_BODY'
            echo 'Auto-generated draft and semantic review attached.'
            echo ''
            echo '**Operator action required.** Merge happens only when you click it.'
            echo 'Review the draft and the `.review.json` verdict, then merge only if approved.'
            echo 'If `verdict: REJECT`, do not merge — open an issue and rework the prompt.'
            echo ''
            echo '## Run summary'
            echo ''
            echo '```json'
            jq '{ slateSource, sport, pickCount, sources, verdict, totals }' "$TELE" 2>/dev/null || cat "$TELE"
            echo '```'
            echo ''
            echo '## Review verdict'
            echo ''
            echo '```json'
            jq '.summary' "$REV" 2>/dev/null || head -50 "$REV"
            echo '```'
            echo ''
            echo 'Generated by `.github/workflows/nightly-content.yml`.'
            echo 'EOF_PR_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Open PR with the draft
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          branch: nightly-content/${{ github.run_id }}
          base: main
          title: "[draft] Nightly content for ${{ steps.draft.outputs.date }}"
          body: ${{ steps.pr_body.outputs.body }}
          labels: |
            content
            draft-only
            needs-operator-review
          add-paths: |
            _drafts/
          delete-branch: true
