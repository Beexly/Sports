name: Refresh odds (intraday)

# Vercel Hobby crons run once daily, but pregame lines move all day. This
# scheduler hits the same authenticated cron route the Vercel job uses, several
# times a day, so published picks are always priced off recent lines and the
# freshness gate can eventually be tightened from 12h back toward 4h.
#
# Setup (one time): repo Settings -> Secrets and variables -> Actions ->
# New repository secret -> name CRON_SECRET, value = the same CRON_SECRET as
# Vercel production. Rotating it means updating both places.

on:
  schedule:
    # UTC. Six intraday passes covering the US slate rhythm, on top of Vercel's
    # own 10:00 UTC (6am ET) cron. With lines never more than ~2-3h old at any
    # publish moment, ODDS_FRESHNESS_MAX_HOURS can be tightened from 12 toward 4.
    - cron: "0 13 * * *"   # 9:00 AM ET  - overnight/morning line moves
    - cron: "0 15 * * *"   # 11:00 AM ET - late-morning sharpening
    - cron: "0 17 * * *"   # 1:00 PM ET  - afternoon slates go live
    - cron: "0 19 * * *"   # 3:00 PM ET  - pre-evening positioning
    - cron: "0 21 * * *"   # 5:00 PM ET  - lineups posted, sharp money lands
    - cron: "30 23 * * *"  # 7:30 PM ET  - first-pitch final pass
  workflow_dispatch: {}    # manual "Run workflow" button for testing

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger refresh-odds
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET repo secret is not set; skipping (add it in repo Settings -> Secrets -> Actions)."
            exit 0
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://www.galaxysportsedge.com/api/cron/refresh-odds")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP ${code}"
          echo "${body}"
          # The route returns 200 with ok:false when a sport is legitimately
          # quiet/stale; only transport/auth failures should fail the job.
          [ "${code}" = "200" ]
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
