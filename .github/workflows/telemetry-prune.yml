name: Telemetry Log Prune

# Deletes claude_usage_logs rows older than CLAUDE_LOG_RETENTION_DAYS
# (default 90 days) from Postgres to prevent unbounded table growth.
#
# Hard Rule §6 compatible: read-then-delete only. No Claude calls, no PR,
# no external surface. The deleted count is logged to the workflow run.

on:
  schedule:
    - cron: "0 3 * * 0"  # 03:00 UTC every Sunday
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Days to retain (default 90)"
        required: false
        default: "90"

concurrency:
  group: telemetry-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prune old telemetry rows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          CLAUDE_LOG_RETENTION_DAYS: ${{ github.event.inputs.retention_days || '90' }}
        run: node scripts/prune-claude-usage-logs.mjs
