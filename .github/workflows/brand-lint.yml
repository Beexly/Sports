name: Brand lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  brand-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:brand
      - run: npm run test --workspace=@sports/brand
      - run: npm run test --workspace=@sports/ui-brand
      - run: npm run test --workspace=@sports/emails
      - run: npm run test --workspace=@sports/social-formatters
