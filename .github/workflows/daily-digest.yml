name: Daily Digest

# Builds a no-Claude, pure-template daily digest from CHANGELOG +
# telemetry log + _drafts/ files. Opens a PR for operator skim.
#
# Hard Rule §6 compatible: no Claude call (zero spend), DRAFT-only PR,
# the PR sits until an operator clicks merge.

on:
  schedule:
    - cron: "55 23 * * *"  # 23:55 UTC daily
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build digest
        id: build
        run: |
          node scripts/build-daily-digest.mjs
          DATE=$(date -u +%Y-%m-%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "digest_path=_digests/${DATE}.md" >> "$GITHUB_OUTPUT"

      - name: Open PR with the digest
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          branch: daily-digest/${{ github.run_id }}
          base: main
          title: "[digest] Daily session digest · ${{ steps.build.outputs.date }}"
          body: |
            Daily operator digest. Pure-template — no Claude was called
            to build this file (zero spend).

            Skim, merge to capture the digest in the repo, or close to
            discard. **Operator click required to merge.**

            Generated by `.github/workflows/daily-digest.yml`.
          labels: |
            digest
            draft-only
          add-paths: |
            _digests/
          delete-branch: true
