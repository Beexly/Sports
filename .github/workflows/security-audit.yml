name: Security Audit

# Weekly automated dependency vulnerability scan.
# Runs as informational (allow-failure) for MODERATE findings that cannot be
# fixed without waiting on upstream maintainers or a Vitest 4.x major upgrade.
#
# Resolved HIGH/CRITICAL (2026-05-24):
#   next@14.2.35 — 14 CVEs (DoS, HTTP smuggling, cache poisoning, SSRF, XSS)
#                  FIXED by upgrading to next@16.2.6
#   glob CLI     — command injection via --cmd flag
#                  FIXED as transitive dep eliminated by next@16
#
# Current MODERATE baseline (2026-05-24):
#   next@16.2.6 via postcss     — fix requires next@16.3.0+ (not yet stable)
#   next-auth                   — transitive through next; no standalone fix
#
# Resolved MODERATE:
#   vitest@2.x / vite@5 / esbuild — FIXED by upgrading to vitest@4.1.7 + vite@6.3.0
#
# Action: watch next@16.3.0 release (fixes postcss MODERATE).
# This job fails on HIGH/CRITICAL; MODERATE is informational-only.

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run security audit (HIGH/CRITICAL must be 0)
        # Fail on high/critical; MODERATE tracked informally below.
        # Change `--audit-level=moderate` to remove the informational-only period.
        continue-on-error: false
        run: npm audit --audit-level=high

      - name: Run security audit (full report, informational)
        continue-on-error: true
        run: |
          echo "::group::Full audit report"
          npm audit
          echo "::endgroup::"

      - name: Summarize findings
        continue-on-error: true
        run: |
          echo "## Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
          npm audit --json | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          vulns = data.get('vulnerabilities', {})
          by_sev = {}
          for name, v in vulns.items():
              s = v.get('severity', 'unknown')
              by_sev.setdefault(s, []).append(name)
          if not vulns:
              print('No vulnerabilities found.')
          else:
              for sev in ('critical', 'high', 'moderate', 'low'):
                  names = by_sev.get(sev, [])
                  if names:
                      print(f'### {sev.upper()} ({len(names)})')
                      for n in names:
                          v = vulns[n]
                          via = v.get('via', [])
                          titles = [x.get('title','') for x in via if isinstance(x, dict) and x.get('title')]
                          print(f'- **{n}**: {titles[0] if titles else \"transitive\"}')
          " >> $GITHUB_STEP_SUMMARY
