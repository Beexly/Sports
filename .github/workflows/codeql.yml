name: "CodeQL"

# Static analysis (SAST) for the JS/TS monorepo (Next.js app + packages/workers).
# Weekly + push/PR coverage catches injection, XSS, and secret-handling bugs that
# unit tests don't target. The JS/TS extractor builds its own model from source,
# so no explicit build step is required — do not add one "to be safe".

on:
  push:
    branches: ["main", "claude/*"]
  pull_request:
    branches: ["main"]
  schedule:
    # Sundays at 04:17 UTC — off-peak, off-the-hour to avoid GitHub's
    # top-of-hour scheduling thundering herd.
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
