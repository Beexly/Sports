name: Python tests (gse-ml-service)

# PATH-FILTERED ON PURPOSE. This repo's Actions minutes were exhausted once already this
# cycle (see the `scheduler-liveness` / `traffic-heartbeat` ops modules), and that budget
# exhaustion was a direct cause of a production ingestion outage. A Python job that fired
# on every push would compete for the same pool while adding nothing on the ~99% of
# changes that never touch this directory — so it runs only when gse-ml-service/** (or
# this workflow) changes.
#
# CONSEQUENCE, stated so nobody debugs it twice: because the filter is on
# `pull_request` too, this workflow does NOT run at all on a PR that touches no Python
# here. Do not add it to branch protection as a required check without also adding a
# path-aware skip job — a required check that never starts leaves PRs pending forever.
on:
  push:
    branches: [main, "claude/*", "sports-intelligence-os-*"]
    paths:
      - "gse-ml-service/**"
      - ".github/workflows/python-tests.yml"
  # No base-branch filter, matching ci.yml: stacked PRs target claude/* bases and must
  # still be tested.
  pull_request:
    paths:
      - "gse-ml-service/**"
      - ".github/workflows/python-tests.yml"

# Same grouping rule as ci.yml: key on the SOURCE branch so the push/PR pair for one
# commit dedupes across event types, qualified by head repo so same-named fork branches
# stay in separate groups. Only pull_request may cancel, and never on main.
concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # 3.11, not 3.10: 3.11 is the interpreter the suite is verified on and the
          # base image the Dockerfile uses.
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: gse-ml-service/requirements.txt

      # --no-deps is REQUIRED: requirements.txt is a complete pinned lock. Resolving
      # dependencies would pull persim -> hopcroftkarp (sdist-only, compiled at install
      # time) and the matplotlib stack, none of which this service imports. Verified to
      # install cleanly on a stock pip (24.0) with no build step. See the header of
      # gse-ml-service/requirements.txt.
      - name: Install dependencies
        run: python -m pip install --no-deps -r gse-ml-service/requirements.txt

      # Run from the repo root: gse-ml-service/conftest.py puts the service root on
      # sys.path, which is what makes `from app.models.x import y` resolve for the
      # __init__.py-free package tree.
      - name: Run tests
        run: python3 -m pytest gse-ml-service/app/tests -q
