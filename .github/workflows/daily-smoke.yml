name: Daily Smoke Test

# Runs the production smoke test every morning. Fails noisily so the
# Actions tab surfaces any regression before customers do.
#
# The script (scripts/smoke-prod.sh) checks:
#   - apex → www redirect
#   - 19 critical routes return 200
#   - homepage & pricing free of regression strings (founder name, v5.0, gold)
#   - security headers (HSTS, X-Frame-Options, etc.)
#   - canonical URLs match their own path
#   - external-cron workflow state via GitHub API
#
# Exit codes: 0 SHIP / 1 WATCH (warning) / 2 FAIL (regression)

on:
  schedule:
    - cron: "30 13 * * *"  # 13:30 UTC = ~9:30am ET / 6:30am PT
    - cron: "30 8 * * *"   # 08:30 UTC = 02:30am CST verified-ledger sync check
  workflow_dispatch:

concurrency:
  group: daily-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # secrets context is NOT allowed in step-level `if` (workflow fails at
    # startup with zero jobs). Expose it as job env, then gate on env context.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke test
        env:
          # Required for private-repo workflow list (section 6 of smoke-prod.sh).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/smoke-prod.sh

      # The ledger step needs tsx + a generated Prisma client; the runner has
      # neither after a bare checkout. Mirror the CI install pattern, gated on
      # the same secret so the morning smoke stays fast when it is absent.
      - name: Setup Node.js (ledger verification)
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (ledger verification)
        if: ${{ env.DATABASE_URL != '' }}
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client (ledger verification)
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run db:generate

      - name: Verify daily settlement ledger refresh when DATABASE_URL configured
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run verify:ledger && node -e "const d = require('./apps/web/lib/ledger/verified-ledger.json'); if (!d.generatedAt || !d.official) process.exit(1); console.log('verified-ledger OK:', d.generatedAt);"
