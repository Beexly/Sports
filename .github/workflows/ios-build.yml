name: iOS build (SwiftUI)

# Free build lane for the native SwiftUI app: compiles AND tests on GitHub's
# macOS runners. No Mac required, no signing (simulator build + unit tests).
on:
  push:
    branches: [feat/ios-swiftui]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    branches: [main]
    paths: ["ios/**"]
  workflow_dispatch:

jobs:
  project:
    # Cheap, and the only thing that catches a hand-edited pbxproj.
    # project.pbxproj is GENERATED (ios/generate_project.py); a hand edit
    # silently drops files from the build, which is the exact failure mode the
    # generator exists to prevent.
    name: Project file is in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check project.pbxproj matches the source tree
        run: python3 ios/generate_project.py --check

  build-and-test:
    name: Build + test
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications | grep -i xcode || true

      - name: Select Xcode 16 if present
        run: |
          for app in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app Xcode_16.1.app Xcode_16.app; do
            if [ -d "/Applications/$app" ]; then
              echo "Selecting /Applications/$app"
              sudo xcode-select -s "/Applications/$app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Select an available simulator
        run: |
          # A hard-coded destination is a flaky test lane: simulator runtimes
          # get added and removed from GitHub's images. Pick whatever is
          # actually installed rather than failing on a missing UDID.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable'):
                      print(device['udid'])
                      raise SystemExit
          ")
          if [ -z "$UDID" ]; then
            echo "::error::No available iOS simulator runtime on this runner"
            exit 1
          fi
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Lint the project file with macOS's own plist parser
        # `xcodebuild` reports a malformed pbxproj as "damaged ... parse error"
        # with no line number, which is close to undebuggable. `plutil` is the
        # same parser with a line number, and it costs nothing. A brace count
        # does not work here: the file that Xcode refused to open had balanced
        # braces, balanced parens, and no dangling references.
        # Two things this step has to get right, both learned the hard way.
        #
        # 1. plutil picks its reader from the file name, and "project.pbxproj"
        #    is not a property-list extension, so it reads the file as XML and
        #    rejects the OpenStep source Xcode actually writes. The first error
        #    here was "Unexpected character / at line 1" on the `// !$*UTF8*$!`
        #    header; dropping that header only moved the complaint to the `{`
        #    on the next line, and `{` is *valid* OpenStep — a dead giveaway
        #    that the wrong reader was in use, not a malformed file. Lint a
        #    .plist-named copy so the OpenStep reader gets selected.
        #
        # 2. A guard that has quietly stopped reading anything still exits 0,
        #    so the corrupt copy has to be rejected for the good one to count.
        #    If plutil cannot even reject that, it is not a usable guard on
        #    this runner: say so out loud rather than passing for free. The
        #    check that actually has to hold is the next step, where Xcode's
        #    own reader opens the project.
        run: |
          work="$(mktemp -d)"
          cp ios/GalaxySportsEdge.xcodeproj/project.pbxproj "$work/project.plist"
          { cat "$work/project.plist"; printf '}\n'; } > "$work/corrupt.plist"

          if plutil -lint "$work/corrupt.plist" >/dev/null 2>&1; then
            echo "::warning::plutil accepted a deliberately corrupt plist on this runner; not a usable guard here, leaving the project to xcodebuild to parse"
          else
            plutil -lint "$work/project.plist"
          fi
          plutil -lint ios/GalaxySportsEdge/Info.plist
          plutil -lint ios/GalaxySportsEdge/PrivacyInfo.xcprivacy

      - name: Xcode can read the project
        # The real parse. `xcodebuild -list` is Xcode's own reader on the
        # project file, and it is what the build and test steps both depend on,
        # so it is checked on its own rather than inferred from a build that
        # has not run yet.
        run: xcodebuild -list -project ios/GalaxySportsEdge.xcodeproj

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild -project ios/GalaxySportsEdge.xcodeproj \
            -scheme GalaxySportsEdge \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/GalaxySportsEdge.xcodeproj \
            -scheme GalaxySportsEdge \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/test.log
          # `xcodebuild test` exits 0 on a run that produced no test bundle at
          # all, so "no results" is checked explicitly rather than trusted.
          grep -qE "Test Suite '.*' passed|Executed [0-9]+ tests" /tmp/test.log
          grep -q "TEST SUCCEEDED" /tmp/test.log

      - name: Re-check the project file after the build
        # Cheap insurance that the run did not silently mutate anything.
        run: python3 ios/generate_project.py --check
