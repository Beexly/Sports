name: iOS build (SwiftUI)

# Free build lane for the native SwiftUI app: compiles AND tests on GitHub's
# macOS runners. No Mac required, no signing (simulator build + unit tests).
on:
  push:
    branches: [feat/ios-swiftui]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    branches: [main]
    paths: ["ios/**"]
  workflow_dispatch:

jobs:
  project:
    # Cheap, and the only thing that catches a hand-edited pbxproj.
    # project.pbxproj is GENERATED (ios/generate_project.py); a hand edit
    # silently drops files from the build, which is the exact failure mode the
    # generator exists to prevent.
    name: Project file is in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check project.pbxproj matches the source tree
        run: python3 ios/generate_project.py --check

      - name: Check project.pbxproj is structurally sound
        # A real OpenStep parse, reporting a line and a column. `xcodebuild
        # -list` on the macOS runner catches the same class of damage, but it
        # says only "The project is damaged and cannot be opened due to a
        # parse error" and costs a whole slow lane to find out. This one found
        # `buildActionMask = [PHONE];` in under a second -- a pbxproj is an
        # OpenStep property list and `[` cannot begin a value in one, so Xcode
        # choked on a project whose braces all balanced.
        run: python3 ios/check_pbxproj.py

  build-and-test:
    name: Build + test
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications | grep -i xcode || true

      - name: Select Xcode 16 if present
        run: |
          for app in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app Xcode_16.1.app Xcode_16.app; do
            if [ -d "/Applications/$app" ]; then
              echo "Selecting /Applications/$app"
              sudo xcode-select -s "/Applications/$app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Select an available simulator
        run: |
          # A hard-coded destination is a flaky test lane: simulator runtimes
          # get added and removed from GitHub's images. Pick whatever is
          # actually installed rather than failing on a missing UDID.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable'):
                      print(device['udid'])
                      raise SystemExit
          ")
          if [ -z "$UDID" ]; then
            echo "::error::No available iOS simulator runtime on this runner"
            exit 1
          fi
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Lint the shipped property lists
        # Only the two XML property lists, and only because plutil is the right
        # tool for those. It is NOT used on project.pbxproj: a pbxproj is
        # OpenStep, and plutil on this runner applies the XML grammar to it
        # whatever the file is called. Measured, not assumed -- the raw file and
        # a copy renamed to .plist both fail with "Unexpected character / at
        # line 1" on the `// !$*UTF8*$!` header, and stripping that header only
        # moves the complaint to the `{` on line 2, which is perfectly valid
        # OpenStep. Do not re-add a pbxproj lint here; the next step opens the
        # project with Xcode's own reader instead, which is the check that
        # actually decides anything.
        #
        # A brace count is not a substitute: the file that Xcode once refused
        # to open had balanced braces, balanced parens and no dangling refs.
        #
        # The control exists because a lint that has quietly stopped reading
        # anything still exits 0. If plutil cannot reject a deliberately
        # corrupt copy, it is not doing any work here, and the step says so
        # rather than reporting a pass it did not earn.
        run: |
          work="$(mktemp -d)"
          # Drop the closing </plist> so the document cannot parse. An earlier
          # version of this control appended a stray element after the root,
          # which plutil accepted -- a control that the tool passes proves
          # nothing, so the corruption has to be one no reader can forgive.
          sed '$d' ios/GalaxySportsEdge/Info.plist > "$work/corrupt.plist"
          if plutil -lint "$work/corrupt.plist" >/dev/null 2>&1; then
            echo "::warning::plutil accepted a deliberately corrupt plist on this runner; this step is not a real check here"
            exit 0
          fi
          plutil -lint ios/GalaxySportsEdge/Info.plist
          plutil -lint ios/GalaxySportsEdge/PrivacyInfo.xcprivacy

      - name: Xcode can read the project
        # The real parse, and the one that matters. `xcodebuild -list` runs
        # Xcode's own reader over project.pbxproj -- the same reader the build
        # and test steps depend on -- and fails loudly on a project it cannot
        # open, instead of surfacing as "damaged ... parse error" three steps
        # later with no line number.
        run: xcodebuild -list -project ios/GalaxySportsEdge.xcodeproj

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild -project ios/GalaxySportsEdge.xcodeproj \
            -scheme GalaxySportsEdge \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/GalaxySportsEdge.xcodeproj \
            -scheme GalaxySportsEdge \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/test.log
          # `xcodebuild test` exits 0 on a run that produced no test bundle at
          # all, so "no results" is checked explicitly rather than trusted.
          grep -qE "Test Suite '.*' passed|Executed [0-9]+ tests" /tmp/test.log
          grep -q "TEST SUCCEEDED" /tmp/test.log

      - name: Re-check the project file after the build
        # Cheap insurance that the run did not silently mutate anything.
        run: python3 ios/generate_project.py --check
