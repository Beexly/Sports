name: External Cron (Galaxy Sports Edge)

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which cron endpoint to call"
        required: true
        default: refresh-odds
        type: choice
        options:
          - refresh-odds
          - settle-picks

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: external-cron-${{ github.event.schedule || github.event.inputs.target || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Select target route
        id: target
        shell: bash
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            workflow_dispatch)
              target="${{ github.event.inputs.target }}"
              ;;
            schedule)
              case "${{ github.event.schedule }}" in
                "*/30 * * * *")
                  target="refresh-odds"
                  ;;
                "15 * * * *")
                  target="settle-picks"
                  ;;
                *)
                  echo "Unsupported schedule: ${{ github.event.schedule }}"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unsupported event: ${{ github.event_name }}"
              exit 1
              ;;
          esac

          case "$target" in
            refresh-odds|settle-picks)
              ;;
            *)
              echo "Unsupported target: $target"
              exit 1
              ;;
          esac

          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Invoke cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail

          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

          if [[ -z "${CRON_TARGET_URL:-}" ]]; then
            echo "CRON_TARGET_URL is not configured"
            exit 1
          fi

          endpoint="${CRON_TARGET_URL%/}/api/cron/${TARGET}"
          echo "Calling ${endpoint}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status_code="$(curl -sS -o "$response_file" -w "%{http_code}" \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            -X POST "$endpoint" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")"

          echo "HTTP ${status_code}"
          cat "$response_file"

          if [[ "$status_code" != "200" ]]; then
            echo "Cron endpoint returned non-200"
            exit 1
          fi
