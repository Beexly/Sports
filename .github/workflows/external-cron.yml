name: External Cron (Galaxy Sports Edge)

# Why this exists:
# Vercel Hobby caps cron frequency at once per day. The Vercel-declared
# crons in `vercel.json` remain the daily backstop. This workflow gives
# us higher-cadence hits with the same CRON_SECRET bearer token Vercel uses.
#
# PRODUCTION SCHEDULER SoT (2026-08-10): **Vercel-only** until private-repo
# GitHub Actions minutes / billing are restored. This workflow may sit idle
# (no runners) — that is accepted, not a bug. Do not invent a second
# scheduler. When minutes return: re-enable Actions billing + set secrets
# CRON_SECRET + CRON_TARGET_URL.
#
# The routes themselves enforce auth and gate writes via
# `getReadinessGates()`, so this is purely a scheduler — no business
# logic lives here.
#
# Required repository secrets:
#   CRON_SECRET       — must match production env
#   CRON_TARGET_URL   — e.g. https://www.galaxysportsedge.com (no trailing slash)
#
# 2026-08-06: free-spine-health primary heartbeat; refresh-player-stats
# secondary (sequential satellites after OOM fix). settle hourly.
# 2026-08-07: autonomy-cycle (I9 plan→act) hourly dry-run / execute when
# AUTONOMY_EXECUTE=true on production (route-side).

on:
  schedule:
    # PRIVATE-REPO MINUTES ECONOMY: keep cadence lean.
    # Hourly on the :15 — settle picks whose games have completed.
    - cron: "15 * * * *"
    # Every 2h at :05 — free multi-source spine + IngestionRun SUCCESS stamp
    # (under 240m SLA; ~12 jobs/day). I3/I8 durable free-spine heartbeat.
    - cron: "5 */2 * * *"
    # Every 6h at :40 — nflverse player-stats free SUCCESS multi-writer
    # (heavier job; free-spine keeps health green between runs).
    - cron: "40 */6 * * *"
    # Hourly at :22 — autonomy plan (+ execute when AUTONOMY_EXECUTE=true).
    # Fills I2 freshness self-heal between free-spine ticks (age > 90m).
    - cron: "22 * * * *"
    # Hourly at :10 — autonomous board fill (ESPN seed + odds dual-path + signals).
    - cron: "10 * * * *"
    # Hourly at :25 — signal slate only (independent fair values).
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which endpoint to hit"
        required: true
        default: "free-spine-health"
        type: choice
        options:
          - free-spine-health
          - refresh-player-stats
          - refresh-odds
          - board-fill
          - generate-signal-slate
          - backfill-independent-trueprob
          - settle-picks
          - jarvis-snapshot
          - autonomy-cycle
          - autonomy-cycle-execute

concurrency:
  group: external-cron-${{ github.event.schedule || github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  free-spine-health:
    name: Free spine health (ingestion heartbeat)
    if: ${{ github.event.schedule == '5 */2 * * *' || github.event.inputs.target == 'free-spine-health' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/free-spine-health
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ] || [ -z "${CRON_TARGET_URL}" ]; then
            echo "::error::CRON_SECRET or CRON_TARGET_URL not configured"
            exit 1
          fi
          response=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --location \
            --max-time 120 \
            "${CRON_TARGET_URL}/api/cron/free-spine-health")
          echo "HTTP ${response}"
          if command -v jq >/dev/null 2>&1; then
            jq . /tmp/body.json || cat /tmp/body.json
          else
            cat /tmp/body.json
          fi
          test "${response}" = "200"

  refresh-player-stats:
    name: Refresh nflverse player stats (free SUCCESS writer)
    if: ${{ github.event.schedule == '40 */6 * * *' || github.event.inputs.target == 'refresh-player-stats' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Hit /api/cron/refresh-player-stats
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ] || [ -z "${CRON_TARGET_URL}" ]; then
            echo "::error::CRON_SECRET or CRON_TARGET_URL not configured"
            exit 1
          fi
          response=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --location \
            --max-time 300 \
            "${CRON_TARGET_URL}/api/cron/refresh-player-stats")
          echo "HTTP ${response}"
          if command -v jq >/dev/null 2>&1; then
            jq . /tmp/body.json || cat /tmp/body.json
          else
            cat /tmp/body.json
          fi
          # 200 when full success or primary weekly-stats ok (satellite empty is honest)
          test "${response}" = "200"

  refresh-odds:
    name: Refresh odds (all sports)
    if: ${{ github.event.schedule == '*/30 * * * *' || github.event.inputs.target == 'refresh-odds' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Hit /api/cron/refresh-odds
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ] || [ -z "${CRON_TARGET_URL}" ]; then
            echo "::error::CRON_SECRET or CRON_TARGET_URL not configured"
            exit 1
          fi
          response=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --location \
            --max-time 360 \
            "${CRON_TARGET_URL}/api/cron/refresh-odds")
          echo "HTTP ${response}"
          if command -v jq >/dev/null 2>&1; then
            jq . /tmp/body.json || cat /tmp/body.json
          else
            cat /tmp/body.json
          fi
          test "${response}" = "200"

  settle-picks:
    name: Settle completed picks
    if: ${{ github.event.schedule == '15 * * * *' || github.event.inputs.target == 'settle-picks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Hit /api/cron/settle-picks
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ] || [ -z "${CRON_TARGET_URL}" ]; then
            echo "::error::CRON_SECRET or CRON_TARGET_URL not configured"
            exit 1
          fi
          response=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --location \
            --max-time 300 \
            "${CRON_TARGET_URL}/api/cron/settle-picks")
          echo "HTTP ${response}"
          if command -v jq >/dev/null 2>&1; then
            jq . /tmp/body.json || cat /tmp/body.json
          else
            cat /tmp/body.json
          fi
          test "${response}" = "200"

  autonomy-cycle:
    name: Autonomy cycle (plan; execute when env flag or ?execute=1)
    # I9: plan→act loop. Default route is dry-run unless AUTONOMY_EXECUTE=true.
    # Manual autonomy-cycle-execute forces ?execute=1 (founder recovery / I2).
    if: ${{ github.event.schedule == '22 * * * *' || github.event.inputs.target == 'autonomy-cycle' || github.event.inputs.target == 'autonomy-cycle-execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/autonomy-cycle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ] || [ -z "${CRON_TARGET_URL}" ]; then
            echo "::error::CRON_SECRET or CRON_TARGET_URL not configured"
            exit 1
          fi
          path="/api/cron/autonomy-cycle"
          if [ "${TARGET:-}" = "autonomy-cycle-execute" ]; then
            path="/api/cron/autonomy-cycle?execute=1"
          fi
          response=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --location \
            --max-time 120 \
            "${CRON_TARGET_URL}${path}")
          echo "HTTP ${response}"
          if command -v jq >/dev/null 2>&1; then
            jq . /tmp/body.json || cat /tmp/body.json
          else
            cat /tmp/body.json
          fi
          test "${response}" = "200"

  jarvis-snapshot:
    name: Jarvis snapshot (manual)
    if: ${{ github.event.inputs.target == 'jarvis-snapshot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Hit /api/cron/jarvis-snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          set -euo pipefail
          response=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --location \
            --max-time 300 \
            "${CRON_TARGET_URL}/api/cron/jarvis-snapshot")
          echo "HTTP ${response}"
          if command -v jq >/dev/null 2>&1; then
            jq . /tmp/body.json || cat /tmp/body.json
          else
            cat /tmp/body.json
          fi
          test "${response}" = "200"

  board-fill:
    name: Board fill (ESPN seed + odds + signals)
    if: ${{ github.event.schedule == '10 * * * *' || github.event.inputs.target == 'board-fill' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Hit /api/cron/board-fill
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ] || [ -z "${CRON_TARGET_URL}" ]; then
            echo "::error::CRON_SECRET or CRON_TARGET_URL not configured"
            exit 1
          fi
          response=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --location \
            --max-time 360 \
            "${CRON_TARGET_URL}/api/cron/board-fill")
          echo "HTTP ${response}"
          if command -v jq >/dev/null 2>&1; then
            jq . /tmp/body.json || cat /tmp/body.json
          else
            cat /tmp/body.json
          fi
          test "${response}" = "200"

  generate-signal-slate:
    name: Generate signal slate (independents only)
    if: ${{ github.event.schedule == '25 * * * *' || github.event.inputs.target == 'generate-signal-slate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Hit /api/cron/generate-signal-slate
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ] || [ -z "${CRON_TARGET_URL}" ]; then
            echo "::error::CRON_SECRET or CRON_TARGET_URL not configured"
            exit 1
          fi
          response=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --location \
            --max-time 360 \
            "${CRON_TARGET_URL}/api/cron/generate-signal-slate")
          echo "HTTP ${response}"
          if command -v jq >/dev/null 2>&1; then
            jq . /tmp/body.json || cat /tmp/body.json
          else
            cat /tmp/body.json
          fi
          test "${response}" = "200"

  backfill-independent-trueprob:
    name: Backfill independent trueProb
    if: ${{ github.event.inputs.target == 'backfill-independent-trueprob' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Hit /api/cron/backfill-independent-trueprob
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ] || [ -z "${CRON_TARGET_URL}" ]; then
            echo "::error::CRON_SECRET or CRON_TARGET_URL not configured"
            exit 1
          fi
          response=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --location --max-time 300 \
            "${CRON_TARGET_URL}/api/cron/backfill-independent-trueprob?limit=120")
          echo "HTTP ${response}"
          jq . /tmp/body.json || cat /tmp/body.json
          test "${response}" = "200"

