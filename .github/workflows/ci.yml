name: CI

on:
  push:
    branches: [main, "claude/*", "sports-intelligence-os-*"]
  # Deliberately NO base-branch filter (adversarial finding O-5.1): stacked
  # PRs target claude/* (and codex/*, review-*, …) bases, and a PR from a head
  # that matches no push filter into such a trunk previously triggered ZERO
  # checks — an unreviewed, untested merge path into branches that later merge
  # to main. Every pull request, whatever its base, must run CI. Do not
  # re-add a branches: filter here.
  pull_request:

# A push to a branch with an open PR triggers both a push and a pull_request
# run; key the group on the SOURCE branch (head_ref for PRs, ref_name for
# pushes) so the duplicate pair dedupes across event types. The head-repo
# qualifier keeps same-named fork branches out of each other's group. Never
# cancel main: every push to main must complete its run.
#
# Only the pull_request event may cancel. Cancelling from EITHER side made the
# survivor a race: on df8bf8f4 the push and PR runs raced inside the same group,
# the `test` job was cancelled 3s into "Set up job", no successor run took over,
# and two guardrail jobs were left in_progress past their own timeout-minutes —
# a commit can then sit on a PR looking checked while CI never actually
# finished. Gating cancellation on pull_request makes the survivor deterministic
# (the PR run always owns the check) and makes the canceller a run that is
# itself guaranteed to complete, so an in-flight test is never orphaned without
# a successor. Push runs no longer cancel, so a branch with no open PR trades a
# little duplicate work for never losing its only run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/main' }}

jobs:
  # --------------------------------------------------------------
  # 1. install + lint + typecheck + test + prisma generate
  # --------------------------------------------------------------
  test:
    name: Test, type-check, lint, Prisma
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sports
          POSTGRES_PASSWORD: sports_test
          POSTGRES_DB: sports_test
        options: >-
          --health-cmd "pg_isready -U sports -d sports_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: "postgresql://sports:sports_test@localhost:5432/sports_test"
      DIRECT_URL: "postgresql://sports:sports_test@localhost:5432/sports_test"
      # §10.9: makes the real-Postgres budget acceptance suite MANDATORY in CI
      # (it installs its own schema + CHECK constraints from the migration SQL).
      AI_BUDGET_PG_URL: "postgresql://sports:sports_test@localhost:5432/sports_test"
      NEXTAUTH_SECRET: "test-secret-do-not-use-in-production"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Prisma schema validate (no migrations)
        run: npx prisma validate --schema packages/db/prisma/schema.prisma

      # Migration history is the source of truth (one idempotent baseline since
      # 2026-09-02 plus forward migrations). The empty test database is built by
      # replaying it exactly as production does (scripts/deploy/migrate-if-configured.mjs
      # runs migrate deploy fail-closed), and the drift check proves schema.prisma and
      # the applied migrations describe the same database. Both steps are blocking.
      - name: Apply migrations (prisma migrate deploy, empty test DB)
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Migration drift check (schema.prisma vs applied migrations)
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel packages/db/prisma/schema.prisma --exit-code

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests (all workspaces)
        run: npm test

      - name: Run Vercel skip-gate tests
        run: node --test scripts/vercel-skip-build.test.mjs

      - name: Verify L11 calibration evidence still adds up
        run: node --test docs/calibration-proposals/evidence/verify-evidence.test.mjs

      # The MIND falsification suite is written with node:test, NOT vitest, so the
      # prediction-engine vitest config's include pattern (`src/**/*.test.ts`,
      # `test/**/*.spec.ts`) does NOT collect it. Measured before this step was
      # added: `vitest run src/reasoning/__tests__/mind-reasoning.mutation-v2.spec.ts`
      # exits 1 with "No test files found", and `node --test` on the same file
      # reports 11 passing tests.
      #
      # Those 11 tests are not incidental. Probe T1 in that file is the
      # IN-QUOTE NUMERIC PERTURBATION probe -- the assertion that mutating
      # numeric_claim from 0.024 to 0.048 scales total_delta by exactly 2x and
      # updates the rendered prose without a legacy string -- which is the same
      # property the goal spec's Table 5 T1 row names, applied to the MIND
      # engine's corpus rather than the literature corpus. It also carries the
      # ACWR content-driven invariants, the residual-hardcode eradication
      # invariant, and the class-A exclusivity probes.
      #
      # A gate that CI never executes is not a gate. It sat in the repository
      # looking like one, and would have stayed green while the behaviour it
      # pins drifted. This step is what makes it real.
      - name: Run the MIND falsification suite (node:test, not collected by vitest)
        run: node --import tsx --test packages/prediction-engine/src/reasoning/__tests__/mind-reasoning.mutation-v2.spec.ts

      # THE GAP CLOSURE LEDGER. Every status in reconciliation/gap_closures.json is
      # RE-DERIVED from a mechanical probe on every run -- a grep, a file check, an
      # artifact's own count -- so a closure that stops holding flips itself.
      #
      # And a flip is not silent: the script reads the PREVIOUS ledger first, and a gap
      # that was `closed` and is no longer closed is a REGRESSION that exits 1 with the
      # gap named. A closure is therefore a claim CI re-checks, not a note somebody
      # wrote once.
      #
      # The ledger is a SEPARATE file on purpose: reconciliation/gaps.json is GENERATED
      # by reconciliation/_build_gaps.py, so a hand-added `status` field there would be
      # wiped on the next regeneration.
      - name: Verify the gap closure ledger (re-derives every status; fails on a regression)
        run: node reconciliation/_verify_gap_closures.mjs

      # The seven `apps/mobile/tests/*.test.js` suites are NOT in the matrix: they
      # fail today, and a red suite is not a gate. They are excluded here on purpose
      # rather than left to fail the build, and their status is recorded in
      # handoff/NODE_TEST_SUITES_IN_CI.md.

      # §10.9: the budget acceptance run is mandatory and its evidence is
      # RETAINED — a missing artifact fails the build.
      - name: Upload budget acceptance artifact (§10.9)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-budget-acceptance
          path: apps/web/test-artifacts/ai-budget-acceptance.json
          retention-days: 90
          if-no-files-found: error

  # --------------------------------------------------------------
  # 1b. The node:test guardrail matrix
  # --------------------------------------------------------------
  #
  # WHY THIS IS ITS OWN JOB AND NOT A STEP IN `test`. The matrix landed on main
  # 2026-10-21 as a `strategy:` block nested INSIDE a step of the `test` job.
  # A step may not carry `strategy:` or reference `matrix`, so GitHub refused to
  # compile the whole workflow: every push and every pull request since produced a
  # run with ZERO jobs and the banner "This run likely failed because of a workflow
  # file issue". The consequence was not a red check -- it was NO check. For ~32h
  # (last compiled run 962033f02, 2026-10-28T17:54Z; first zero-job run c1aa47aa3,
  # 2026-10-29T04:59Z) main merged without the test, typecheck, lint or build gates
  # running at all, and the failure looked identical to a normal red run in any list
  # that only shows conclusion. A matrix must live on the JOB.
  #
  # Twenty-one suites, 322 assertions. The pattern is the one the MIND step in
  # `test` already established: the prediction-engine vitest config's include
  # patterns (`src/**/*.test.ts`, `test/**/*.spec.ts`) do NOT collect `node:test`
  # files, so `npm test` skips them entirely. A guard that CI never executes is not
  # a gate -- it sits in the repository looking like one and stays green while the
  # behaviour it pins drifts. That is the SAME failure mode as the class-A guard,
  # the canonical AST (private to a script), and the 7.099 CRPS bar.
  #
  # A MATRIX rather than one long `node --test` invocation so that a failure names
  # the suite that broke instead of pointing at a wall of TAP output, and so a slow
  # suite cannot mask a fast one. The list is a MATRIX OF MATRICES: every file is
  # listed explicitly, so a new guardrail suite is NOT picked up automatically. That
  # is deliberate -- a suite that fails on its first appearance should be added here
  # on purpose, after it has been seen green.
  #
  # MEASURED 2026-10-31 on this tree: all 21 exit 0. On 2026-10-30, 20 of the 21
  # exited 0; `draft-only.test.mjs` exited 1 because `scripts/post_week6_x_thread.js`
  # (a spent week-6 one-off that loaded .env.local credentials and posted a 6-part
  # thread to @GalaxySportsHQ) referenced the X transport from `scripts/`. The
  # guardrail was right, and THE GUARDRAIL WAS NOT TOUCHED: the spent script was
  # removed, which restores the invariant the workers/twitter-bot exception rests
  # on (zero importers of the transport outside its own directory). A guardrail
  # removed to make CI green remains the failure this job exists to prevent.
  node-test-guardrails:
    name: Guardrail suite (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - scripts/ai/build-call-site-inventory.test.mjs
          - scripts/db/prune-usage.test.mjs
          - scripts/edge-lab/freeze-model-hash.test.mjs
          - scripts/factors/index.test.mjs
          - scripts/guardrails/commercial-copy-scan.test.mjs
          - scripts/guardrails/draft-only.test.mjs
          - scripts/guardrails/dependency-audit.test.mjs
          - scripts/guardrails/ingestion-source-clearance.test.mjs
          - scripts/guardrails/no-unsupported-performance-claims.test.mjs
          - scripts/guardrails/node-container-parity.test.mjs
          - scripts/guardrails/node-version-parity.test.mjs
          - scripts/guardrails/sealed-holdout-open-scan.test.mjs
          - scripts/guardrails/trust-gate.test.mjs
          - scripts/lib/node-runtime-pin.test.mjs
          - scripts/nova/convergence-inventory.test.mjs
          - scripts/nova/multihead-inventory.test.mjs
          - scripts/nova/nova-intelligence.test.mjs
          - scripts/nova/source-runtime.test.mjs
          - scripts/ops/cron-matrix-from-vercel.test.mjs
          - scripts/ops/free-auto-settle.test.mjs
          - scripts/__tests__/cv-no-synthetic-rng.test.mjs
        # PER-LEG HISTORY. Two suites verify against REAL history, and CI's
        # default depth-1 checkout contains none of it: the runs passed locally
        # (full clone) and failed only in CI.
        #
        #  - scripts/factors/index.test.mjs: buildIndex(gitCheck) requires every
        #    DEAD/CANDIDATE spec's run_sha to RESOLVE to a real commit, and the
        #    pre-registration check walks `git log --all` for the spec file. That
        #    needs commits across all refs. `fetch-depth: "0"` here fetches all
        #    refs' commits; `filter: blob:none` keeps the download to
        #    commits+trees (the check resolves SHAs and reads spec text at those
        #    commits, all lazily fetchable) instead of the repo's ~3.8G of blobs.
        #    "0" is QUOTED on purpose: an unquoted 0 is falsy in Actions
        #    expressions, and `matrix.fetch_depth || 1` below would silently
        #    demote it back to a depth-1 checkout.
        #  - scripts/nova/multihead-inventory.test.mjs: classifyHeadFreshness
        #    compares against `git rev-parse HEAD~1`, which a depth-1 checkout
        #    does not contain. Depth 3 gives HEAD~1 (a merge commit's first
        #    parent) at a trivial cost.
        include:
          - suite: scripts/factors/index.test.mjs
            fetch_depth: "0"
            fetch_filter: blob:none
          - suite: scripts/nova/multihead-inventory.test.mjs
            fetch_depth: "3"

    steps:
      - uses: actions/checkout@v4
        with:
          # Legs without an explicit fetch_depth keep the depth-1 default.
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          filter: ${{ matrix.fetch_filter || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the guardrail suite
        run: node --test "${{ matrix.suite }}"

  # --------------------------------------------------------------
  # 2. Build
  # --------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Next.js app
        run: npm run build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          NEXTAUTH_SECRET: "build-placeholder"
          NEXTAUTH_URL: "http://localhost:3000"
          SKIP_ENV_VALIDATION: "true"

  # --------------------------------------------------------------
  # 3. Trust gate — public-copy scanner banned-phrase regression
  # --------------------------------------------------------------
  trust-gate:
    name: Trust gate (banned phrases on public copy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client (types only)
        run: npm run db:generate

      - name: Run public-copy scanner test
        working-directory: apps/web
        run: npx vitest run __tests__/public-copy-scanner.test.ts

      - name: Run banned-phrase guardrail script
        run: node scripts/guardrails/trust-gate.mjs


  # --------------------------------------------------------------
  # 3b. AI Council DESTROY — claim/partner/rights/crypto ship blockers
  # --------------------------------------------------------------
  ai-council:
    name: AI Council (DESTROY ship blockers)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run AI Council package tests
        run: npm run guard:ai-council

  # --------------------------------------------------------------
  # 4. Model-freeze — MODEL_VERSION cannot move without an IMPLEMENTED
  #    CalibrationProposal landing in the same change.
  # --------------------------------------------------------------
  model-freeze:
    name: Model freeze (MODEL_VERSION guardrail)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Run model-freeze guardrail
        run: node scripts/guardrails/model-freeze.mjs

  # --------------------------------------------------------------
  # 5. Draft-only — no API/page surface may write publishedAt or
  #    flip a draft to PUBLISHED status outside the explicit (and
  #    currently non-existent) publish boundary.
  # --------------------------------------------------------------
  draft-only:
    name: Draft-only (no auto-publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Run draft-only guardrail
        run: node scripts/guardrails/draft-only.mjs

  # --------------------------------------------------------------
  # 5b. Secret-scan — full-tree credential gate. The pre-commit hook
  #     scans the staged set; CI must scan EVERY tracked file (--all)
  #     so a secret already committed is caught, not just one being
  #     newly staged. Pure node + git, so no install step is needed.
  # --------------------------------------------------------------
  secret-scan:
    name: Secret scan (full tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Run secret-scan guardrail (all tracked files)
        run: node scripts/guardrails/secret-scan.mjs --all

  # --------------------------------------------------------------
  # 5c. Class-A Literature Coverage Guard (GAP-14 closure)
  #     Enforces that all 114 read sites and 12 insert paths honor
  #     the verified Class-A literature constraint without bypass.
  # --------------------------------------------------------------
  class-a-coverage:
    name: Class-A Literature Coverage Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Run Class-A literature coverage check
        run: node reconciliation/_check_class_a_coverage.mjs

  # --------------------------------------------------------------
  # 6. Composite guardrails job — convenience target for local + branch
  #    protection rules.
  # --------------------------------------------------------------
  dependency-audit:
    name: Dependency audit (critical/high CVEs in prod deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      # `npm ci --no-audit` elsewhere only silences the install-time report; npm
      # install never fails a build on CVEs. This job is the actual gate.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fail on unwaived critical/high advisories
        run: node scripts/guardrails/dependency-audit.mjs

  api-v1-boundary:
    name: API v1 boundary (shadow stack)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Run API v1 boundary guardrail
        run: node scripts/guardrails/api-v1-boundary.mjs

  ai-transport-import-boundary:
    name: AI transport import boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      # The AST-based guard imports the `typescript` compiler, so deps must be
      # installed (the previous regex guard needed none).
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run AI transport import-boundary mutation tests
        run: node --test scripts/guardrails/ai-transport-import-boundary.test.mjs

      - name: Run AI transport import-boundary guardrail
        run: node scripts/guardrails/ai-transport-import-boundary.mjs

  guardrails:
    name: All guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (minimal)
        run: npm ci --no-audit --no-fund

      - name: Run all guardrails
        run: npm run guardrails

  # --------------------------------------------------------------
  # 7. Brand-safety — fast, focused job that fences the customer-
  #    facing copy invariants. Runs the public-copy scanner plus the
  #    policy / dashboard / Jarvis tests that gate visible claims.
  #    Designed to fail in under a minute if a PR introduces a
  #    customer-copy regression — without waiting for the full test
  #    matrix.
  # --------------------------------------------------------------
  brand-safety:
    name: Brand safety (customer copy invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client (types only)
        run: npm run db:generate

      - name: Run customer-surface invariant tests
        working-directory: apps/web
        run: |
          npx vitest run \
            __tests__/public-copy-scanner.test.ts \
            __tests__/public-performance-policy.test.ts \
            __tests__/dashboard-performance-gate.test.ts \
            __tests__/history-eligibility.test.ts \
            __tests__/jarvis.test.ts \
            __tests__/cockpit-routes.test.ts \
            __tests__/trust-claims.test.ts
