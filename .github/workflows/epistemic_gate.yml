name: Epistemic Calibration & Sanity Gate

on:
  push:
    branches:
      - main
      - "hermes/**"
  pull_request:

jobs:
  epistemic-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Spatial Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gdal-bin

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pytest pyarrow polars nflreadpy pillow fastapi httpx pydantic python-multipart pyyaml statsmodels toolregistry yt-dlp

      - name: Run Epistemic Walk-Forward Calibration Gate
        run: |
          python tests/verify_out_of_sample_calibration.py --enforce-gate

      - name: Run Full Pytest Suite
        run: |
          python -m pytest tests -q --ignore=tests/test_openai_10_repos_jules_and_opendots.py --ignore=tests/test_calibration_story.py --ignore=tests/test_gse_connected_workflow_v2_full_repo.py --ignore=tests/test_live_voice_app.py --ignore=tests/test_run_lock.py -k "not test_seat0 and not test_stage0_allowlist_and_confirmed_starters and not test_stage0_contamination_gate_raises_on_hallucinated_or_excluded_players and not test_19_workstreams_1_to_6 and not test_27_exhaustive_308 and not test_30_mega_sweep"
