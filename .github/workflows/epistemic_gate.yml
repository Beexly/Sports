name: Epistemic Calibration & Sanity Gate

on:
  push:
    branches:
      - main
      - "hermes/**"
  pull_request:

jobs:
  epistemic-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Spatial Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gdal-bin

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy pytest pyarrow polars pillow fastapi httpx pydantic python-multipart

      - name: Run Epistemic Walk-Forward Calibration Gate
        run: |
          python tests/verify_out_of_sample_calibration.py --enforce-gate

      - name: Run Full Pytest Suite
        run: |
          python -m pytest tests -q
