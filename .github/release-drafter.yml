# Config consumed by release-drafter/release-drafter@v6 (see
# .github/workflows/release-drafter.yml). Categories are generic conventional
# labels, not this repo's confirmed taxonomy — revisit once real PR labels
# stabilize.

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
      - "bugfix"
      - "bug"
  - title: "🧰 Maintenance"
    labels:
      - "chore"
      - "maintenance"
      - "refactor"
  - title: "📚 Documentation"
    labels:
      - "docs"
      - "documentation"
  - title: "📦 Dependencies"
    labels:
      - "dependencies"
      - "deps"

exclude-labels:
  - "skip-changelog"
  - "no-changelog"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "fix"
      - "bugfix"
      - "bug"
      - "chore"
      - "maintenance"
      - "docs"
      - "dependencies"
  default: patch

template: |
  ## Changes

  $CHANGES

autolabeler:
  - label: "docs"
    files:
      - "**/*.md"
    branch:
      - '/docs\/.+/'
  - label: "chore"
    branch:
      - '/chore\/.+/'
  - label: "fix"
    branch:
      - '/fix\/.+/'
  - label: "feature"
    branch:
      - '/feature\/.+/'

exclude-contributors: []
