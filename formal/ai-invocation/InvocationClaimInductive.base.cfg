\* BASE CASE (and reachable-truth sanity) at the induction constants: run the
\* ORIGINAL behavior spec (Init /\ [][Next]_vars, inherited via EXTENDS) with
\* every conjunct of IndInv as an invariant. Passing confirms IndInv holds in
\* ALL reachable states, which subsumes the induction base case Init => IndInv
\* (initial states are reachable) and shows the auxiliary predicates are true
\* of the modeled system, not vacuous strengthening.
CONSTANTS
    Invocations = {i1, i2}
    Attempts = {a1, a2}
    Fingerprints = {fp1, fp2}
    Actors = {act1, act2}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT AtMostOneClaimOwner
INVARIANT AtMostOneExternalDispatchPerAttempt
INVARIANT DispatchAssignmentStable
INVARIANT SameIdDifferentFingerprintNeverExecutes
INVARIANT AmbiguousAttemptStopsFallback
INVARIANT AtMostOnePendingPerInvocation
INVARIANT RejectedImpliesBound
