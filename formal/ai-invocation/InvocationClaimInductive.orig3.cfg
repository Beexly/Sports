\* INDUCTIVE-STEP CHECK at the ORIGINAL reachability-model constants
\* (3 attempts — InvocationClaim.cfg's bound). Same candidate IndInv, same
\* one-step-closure setup as InvocationClaimInductive.cfg; only the INIT
\* enumeration is ~24x larger. Kept as a separate config because the
\* enumeration is single-threaded and slow (~161M raw candidate states);
\* the fast CTI-loop configs stay at 2 attempts.
CONSTANTS
    Invocations = {i1, i2}
    Attempts = {a1, a2, a3}
    Fingerprints = {fp1, fp2}
    Actors = {act1, act2}

INIT InitIndInv
NEXT Next

INVARIANT TypeOK
INVARIANT AtMostOneClaimOwner
INVARIANT AtMostOneExternalDispatchPerAttempt
INVARIANT DispatchAssignmentStable
INVARIANT SameIdDifferentFingerprintNeverExecutes
INVARIANT AmbiguousAttemptStopsFallback
INVARIANT AtMostOnePendingPerInvocation
INVARIANT RejectedImpliesBound
