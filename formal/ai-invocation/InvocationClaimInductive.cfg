\* INDUCTIVE-STEP CHECK (final candidate): INIT is IndInv itself, so TLC
\* enumerates EVERY state satisfying IndInv (finite — TypeOK leads the
\* conjunct chain and bounds every variable) and verifies that every
\* successor under Next still satisfies every conjunct. "No error found"
\* here == IndInv is inductive for these constants.
\*
\* CONSTANTS SHRUNK vs the reachability model (2 attempts, not 3) — see
\* the note in InvocationClaimInductive.attempt1.cfg and the strengthening
\* log for why, and the receipt for the separate 3-attempt run.
CONSTANTS
    Invocations = {i1, i2}
    Attempts = {a1, a2}
    Fingerprints = {fp1, fp2}
    Actors = {act1, act2}

INIT InitIndInv
NEXT Next

INVARIANT TypeOK
INVARIANT AtMostOneClaimOwner
INVARIANT AtMostOneExternalDispatchPerAttempt
INVARIANT DispatchAssignmentStable
INVARIANT SameIdDifferentFingerprintNeverExecutes
INVARIANT AmbiguousAttemptStopsFallback
INVARIANT AtMostOnePendingPerInvocation
INVARIANT RejectedImpliesBound
