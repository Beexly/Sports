\* CTI search, ATTEMPT 1: are the five safety properties (led by TypeOK)
\* inductive by themselves? INIT is the candidate itself, so TLC enumerates
\* EVERY state satisfying it and checks one-step closure.
\*
\* CONSTANTS SHRUNK for the induction runs: 2 attempts instead of the
\* reachability model's 3 (InvocationClaim.cfg). The INIT-predicate product
\* at 3 attempts is ~161M candidate states and TLC computes initial states
\* single-threaded; 2 attempts (~6.7M) keeps every CTI iteration fast. Two
\* attempts still exercise both interference classes that matter here (a
\* second in-flight attempt on the same invocation, and cross-invocation
\* attempt reuse).
CONSTANTS
    Invocations = {i1, i2}
    Attempts = {a1, a2}
    Fingerprints = {fp1, fp2}
    Actors = {act1, act2}

INIT InitIndInvAttempt1
NEXT Next

INVARIANT TypeOK
INVARIANT AtMostOneClaimOwner
INVARIANT AtMostOneExternalDispatchPerAttempt
INVARIANT DispatchAssignmentStable
INVARIANT SameIdDifferentFingerprintNeverExecutes
INVARIANT AmbiguousAttemptStopsFallback
