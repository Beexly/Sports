\* Small bounded model: 2 invocation ids, 3 attempt ids, 2 fingerprints,
\* 2 actors. Large enough to force claim contention, fingerprint conflict,
\* and ambiguous-outcome fallback races; small enough to be exhaustively
\* checkable in seconds.
CONSTANTS
    Invocations = {i1, i2}
    Attempts = {a1, a2, a3}
    Fingerprints = {fp1, fp2}
    Actors = {act1, act2}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT AtMostOneClaimOwner
INVARIANT AtMostOneExternalDispatchPerAttempt
INVARIANT DispatchAssignmentStable
INVARIANT SameIdDifferentFingerprintNeverExecutes
INVARIANT AmbiguousAttemptStopsFallback
