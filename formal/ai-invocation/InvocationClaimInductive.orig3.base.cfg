\* BASE CASE at the ORIGINAL reachability-model constants (3 attempts):
\* original Spec, every IndInv conjunct as INVARIANT. Companion to
\* InvocationClaimInductive.orig3.cfg — together they give base + inductive
\* step at the original constants, matching InvocationClaim.cfg's bound.
CONSTANTS
    Invocations = {i1, i2}
    Attempts = {a1, a2, a3}
    Fingerprints = {fp1, fp2}
    Actors = {act1, act2}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT AtMostOneClaimOwner
INVARIANT AtMostOneExternalDispatchPerAttempt
INVARIANT DispatchAssignmentStable
INVARIANT SameIdDifferentFingerprintNeverExecutes
INVARIANT AmbiguousAttemptStopsFallback
INVARIANT AtMostOnePendingPerInvocation
INVARIANT RejectedImpliesBound
