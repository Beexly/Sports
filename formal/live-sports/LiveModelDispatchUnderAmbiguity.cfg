\* Small bounded model composing InvocationClaim + CreditReservation.
\* Attempts is deliberately the SAME set instantiated into both base
\* modules (one attempt id = one dispatch attempt = one credit hold).
\* TrustedActors is a strict, non-empty subset of Actors so the model
\* actually exercises both "trusted actor resolves an ambiguous hold"
\* and "untrusted actor cannot" — the untrusted actor never appearing
\* in TrustedReleaseAmbiguousHold's bound variable is what the
\* AmbiguousExposureHeldUntilTrustedResolution invariant is checking.
\* VerifiedBalance < |Attempts| forces at least one REFUSED
\* authorization on every maximal run, same contention shape as the
\* base CreditReservation.cfg.
CONSTANTS
    Invocations = {i1, i2}
    Attempts = {a1, a2, a3}
    Fingerprints = {fp1, fp2}
    Actors = {act1, act2}
    TrustedActors = {act1}
    VerifiedBalance = 2
    RequestCost = 1

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT AmbiguousExposureHeldUntilTrustedResolution
INVARIANT ReservedNeverExceedsBudgetWindowCap
INVARIANT AvailableBudgetNeverNegative
INVARIANT NoDispatchWithoutExposureHold
INVARIANT BaseLedgerNeverExceedsBalance
INVARIANT BaseNeverOverAdmit
INVARIANT BaseAmbiguousAttemptStopsFallback
