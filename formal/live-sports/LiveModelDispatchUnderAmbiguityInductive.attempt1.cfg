\* COMPOSITIONAL INDUCTIVE-STEP CHECK — ATTEMPT 1
\*
\* INIT is IndInvAttempt1 itself, so TLC enumerates EVERY state satisfying
\* the candidate (finite: composed TypeOK leads and bounds every variable,
\* including releaseReason/releaseBy) and checks each conjunct is preserved
\* by Next. "No error found" + search depth 1 == Attempt1 is inductive for
\* these constants.
\*
\* CONSTANTS SHRUNK vs reachability model (LiveModelDispatchUnderAmbiguity.cfg
\* uses |Attempts|=3, VerifiedBalance=2): 2 attempts / balance 1 for fast CTI
\* iteration, matching InvocationClaimInductive's 2-attempt discipline.
\* Re-close at full constants only after Attempt1 (or later) is inductive.
\*
\* Run from formal/live-sports/:
\*   java -cp "$JAR" tlc2.TLC -workers auto -deadlock \
\*     -I ../ai-invocation -I ../credit-budget \
\*     -config LiveModelDispatchUnderAmbiguityInductive.attempt1.cfg \
\*     LiveModelDispatchUnderAmbiguityInductive.tla
\*
CONSTANTS
    Invocations = {i1, i2}
    Attempts = {a1, a2}
    Fingerprints = {fp1, fp2}
    Actors = {act1, act2}
    TrustedActors = {act1}
    VerifiedBalance = 1
    RequestCost = 1

INIT InitIndInvAttempt1
NEXT Next

\* Per-conjunct listing so TLC names the exact failed conjunct on a CTI.
INVARIANT TypeOK
INVARIANT IC_TypeOK
INVARIANT IC_AtMostOneClaimOwner
INVARIANT IC_AtMostOneExternalDispatchPerAttempt
INVARIANT IC_DispatchAssignmentStable
INVARIANT IC_SameIdDifferentFingerprintNeverExecutes
INVARIANT IC_AmbiguousAttemptStopsFallback
INVARIANT IC_AtMostOnePendingPerInvocation
INVARIANT IC_RejectedImpliesBound
INVARIANT CR_TypeOKFinite
INVARIANT CR_LedgerNeverExceedsBalance
INVARIANT CR_NeverOverAdmit
INVARIANT CR_AdmittedCountBoundedByStarted
INVARIANT CR_CommittedCoveredByReserved
INVARIANT AmbiguousExposureHeldUntilTrustedResolution
INVARIANT ReservedNeverExceedsBudgetWindowCap
INVARIANT AvailableBudgetNeverNegative
INVARIANT NoDispatchWithoutExposureHold
