\* INDUCTIVE-STEP CHECK (final candidate): INIT is IndInv itself, so TLC
\* enumerates EVERY state satisfying IndInv (finite — TypeOKFinite leads the
\* conjunct chain and bounds every variable, including the credit ledger's
\* `reserved`/`admittedCount` which the base CR!TypeOK leaves as Nat) and
\* verifies that every successor under the composed Next still satisfies every
\* conjunct. "No error found" here == IndInv is inductive for these constants.
\*
\* CONSTANTS SHRUNK vs the reachability model LiveModelDispatchUnderAmbiguity.cfg
\* (1 invocation / 2 attempts / 1 fingerprint / VerifiedBalance 1, vs 2/3/2/2):
\* the composed state has 12 variables and TLC enumerates INIT single-threaded;
\* the full reachability bound's raw TypeOKFinite product is ~10^11 candidate
\* states. See the module header and the strengthening log for the full
\* rationale and which interference classes the shrink preserves.
CONSTANTS
    Invocations = {i1}
    Attempts = {a1, a2}
    Fingerprints = {fp1}
    Actors = {act1, act2}
    TrustedActors = {act1}
    VerifiedBalance = 1
    RequestCost = 1

INIT InitIndInv
NEXT Next

INVARIANT TypeOKFinite
INVARIANT LiftedAtMostOneClaimOwner
INVARIANT LiftedAtMostOneExternalDispatchPerAttempt
INVARIANT LiftedDispatchAssignmentStable
INVARIANT LiftedSameIdDifferentFingerprintNeverExecutes
INVARIANT LiftedAmbiguousAttemptStopsFallback
INVARIANT AtMostOnePendingPerInvocation
INVARIANT RejectedImpliesBound
INVARIANT LiftedLedgerNeverExceedsBalance
INVARIANT LiftedNeverOverAdmit
INVARIANT AdmittedCountBoundedByStarted
INVARIANT CommittedCoveredByReserved
INVARIANT AmbiguousExposureHeldUntilTrustedResolution
INVARIANT ReservedNeverExceedsBudgetWindowCap
INVARIANT AvailableBudgetNeverNegative
INVARIANT NoDispatchWithoutExposureHold
INVARIANT InflightImpliesHeld
