\* Small bounded model: 4 concurrent authorization attempts racing a
\* verified balance of 3 units where each admitted request costs 1 unit.
\* Balance < number of attempts by construction, so the model forces at
\* least one REFUSED attempt on every maximal run — exactly the scenario
\* the flagship no-double-spend property must hold under.
CONSTANTS
    Attempts = {t1, t2, t3, t4}
    VerifiedBalance = 3
    RequestCost = 1

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT LedgerNeverExceedsBalance
INVARIANT NeverOverAdmit
