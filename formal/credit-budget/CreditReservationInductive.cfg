\* INDUCTIVE-STEP CHECK (final candidate): INIT is IndInv itself, so TLC
\* enumerates EVERY state satisfying IndInv (finite, because TypeOKFinite
\* bounds each variable) and verifies that every successor under Next still
\* satisfies every conjunct of IndInv. "No error found" here == IndInv is
\* inductive for these constants. Same constants as CreditReservation.cfg.
CONSTANTS
    Attempts = {t1, t2, t3, t4}
    VerifiedBalance = 3
    RequestCost = 1

INIT InitIndInv
NEXT Next

INVARIANT TypeOKFinite
INVARIANT LedgerNeverExceedsBalance
INVARIANT NeverOverAdmit
INVARIANT AdmittedCountBoundedByStarted
INVARIANT CommittedCoveredByReserved
