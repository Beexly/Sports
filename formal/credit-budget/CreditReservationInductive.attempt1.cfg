\* CTI search, ATTEMPT 1: is (TypeOKFinite /\ LedgerNeverExceedsBalance /\
\* NeverOverAdmit) inductive by itself? INIT is the candidate itself, so TLC
\* enumerates EVERY state satisfying it and checks one-step closure.
\* Same constants as the reachability model (CreditReservation.cfg).
CONSTANTS
    Attempts = {t1, t2, t3, t4}
    VerifiedBalance = 3
    RequestCost = 1

INIT InitIndInvAttempt1
NEXT Next

INVARIANT TypeOKFinite
INVARIANT LedgerNeverExceedsBalance
INVARIANT NeverOverAdmit
