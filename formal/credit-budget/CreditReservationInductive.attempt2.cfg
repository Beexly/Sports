\* CTI search, ATTEMPT 2: attempt 1 + AdmittedCountBoundedByStarted (added in
\* response to CTI #1 — admittedCount was unglued from `state` and could sit at
\* Cardinality(Attempts) with attempts still Unstarted, so one more Authorize
\* pushed it past the finite type bound).
CONSTANTS
    Attempts = {t1, t2, t3, t4}
    VerifiedBalance = 3
    RequestCost = 1

INIT InitIndInvAttempt2
NEXT Next

INVARIANT TypeOKFinite
INVARIANT LedgerNeverExceedsBalance
INVARIANT NeverOverAdmit
INVARIANT AdmittedCountBoundedByStarted
