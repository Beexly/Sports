<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!--
    Notification icon.

    Apple renders this as a MASK: only the alpha channel is used, and the system
    tints it. So the artwork must be a solid silhouette on a transparent ground —
    no colour, no gradients, no hairline strokes (they vanish at 20pt).

    The mark is therefore reduced to its readable essence: the orbit ring, the
    filled core, and the blade as a thick arc. The off-axis ellipse and the ping
    dot are dropped — at notification size they read as noise, and a silhouette
    that is not instantly legible is worse than a simpler one that is.
  -->
  <g transform="translate(48 48) scale(1.42) translate(-32 -32)">
    <circle cx="32" cy="32" r="27" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
    <path d="M53 21.5 A27 27 0 0 1 46 52" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="32" cy="32" r="9" fill="#FFFFFF"/>
  </g>
</svg>
