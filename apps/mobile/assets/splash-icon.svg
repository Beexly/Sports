<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Splash mark. Field ground, full bleed. Rendered by expo-splash-screen at
    imageWidth 180 inside a #08090C background, so the artwork here is the mark
    alone on the same ground and the seams are invisible.
  -->
  <rect width="512" height="512" fill="#08090C"/>
  <g transform="translate(256 256) scale(5.2) translate(-32 -32)">
    <circle cx="32" cy="32" r="27" fill="none" stroke="#3A3F4B" stroke-width="2"/>
    <ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="#EDE8E0"
             stroke-width="1.8" opacity="0.5" transform="rotate(-24 32 32)"/>
    <path d="M53 21.5 A27 27 0 0 1 46 52" fill="none" stroke="#EDE8E0" stroke-width="5"/>
    <circle cx="32" cy="32" r="7" fill="#EDE8E0"/>
    <circle cx="10" cy="40" r="3.5" fill="#FF4D2E"/>
  </g>
</svg>
