<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Galaxy Sports Edge app icon.

    Geometry is the NEBULA v7 signal mark from
    apps/web/components/brand/logo-mark-inline.tsx, scaled from its 64 unit
    viewBox to a 1024 canvas at Apple's optical icon size (glyph occupies about
    62 percent of the canvas, inside the 60 to 66 percent band).

    Colours are FIELD tokens, verbatim:
      ground  #08090C  carbon / void
      ring    #31353F  mineral-hi   (the orbit, deliberately recessive)
      blade   #EDE8E0  ion-white    (the read)
      core    #EDE8E0  ion-white    (the crossing)
      ping    #FF4D2E  plasma       (the moment of detection)

    iOS requires a full bleed opaque square: no alpha, no rounded corners, no
    pre-applied mask. The system applies the corner radius itself.
  -->
  <rect width="1024" height="1024" fill="#08090C"/>

  <g transform="translate(512 512) scale(10.4) translate(-32 -32)">
    <circle cx="32" cy="32" r="27" fill="none" stroke="#3A3F4B" stroke-width="2"/>
    <ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="#EDE8E0"
             stroke-width="1.8" opacity="0.5" transform="rotate(-24 32 32)"/>
    <path d="M53 21.5 A27 27 0 0 1 46 52" fill="none" stroke="#EDE8E0" stroke-width="5"/>
    <circle cx="32" cy="32" r="7" fill="#EDE8E0"/>
    <circle cx="10" cy="40" r="3.5" fill="#FF4D2E"/>
  </g>
</svg>
