<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PickPilot reticle mark">
  <title>PickPilot</title>
  <defs>
    <radialGradient id="pp-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#221140"/>
      <stop offset="60%" stop-color="#0a0612"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>
    <radialGradient id="pp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D8A" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#4FA8FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#04060a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Carbon background tile (rounded square for social-avatar safe area) -->
  <rect width="512" height="512" rx="96" fill="url(#pp-bg)"/>

  <!-- Atmospheric glow behind the reticle -->
  <circle cx="256" cy="256" r="220" fill="url(#pp-glow)"/>

  <!-- Outer reticle ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FF2D8A" stroke-width="4" opacity="0.85"/>

  <!-- Inner reticle ring -->
  <circle cx="256" cy="256" r="90" fill="none" stroke="#FF2D8A" stroke-width="3" opacity="0.55"/>

  <!-- Crosshair ticks (top/bottom/left/right) -->
  <g stroke="#FF2D8A" stroke-width="6" stroke-linecap="butt">
    <line x1="256" y1="60" x2="256" y2="118"/>
    <line x1="256" y1="394" x2="256" y2="452"/>
    <line x1="60" y1="256" x2="118" y2="256"/>
    <line x1="394" y1="256" x2="452" y2="256"/>
  </g>

  <!-- Ion-blue diagonal tick marks -->
  <g stroke="#4FA8FF" stroke-width="3" stroke-linecap="butt" opacity="0.7">
    <line x1="118" y1="118" x2="142" y2="142"/>
    <line x1="394" y1="118" x2="370" y2="142"/>
    <line x1="118" y1="394" x2="142" y2="370"/>
    <line x1="394" y1="394" x2="370" y2="370"/>
  </g>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="14" fill="#FF2D8A"/>
  <circle cx="256" cy="256" r="6" fill="#FF5BA8"/>
</svg>
