<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Galaxy Sports Edge mark">
  <title>Galaxy Sports Edge</title>
  <defs>
    <linearGradient id="gse-edge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#00E5FF"/>
      <stop offset="55%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#FF2DD6"/>
    </linearGradient>
    <radialGradient id="gse-bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%"  stop-color="#0F1424"/>
      <stop offset="60%" stop-color="#070A11"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <radialGradient id="gse-signal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FF2DD6" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#7A5CFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Carbon background, social-avatar safe area -->
  <rect width="512" height="512" rx="96" fill="url(#gse-bg)"/>

  <!-- Faint outer orbit ring — depth field, never a letterform -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#1A1D23" stroke-width="2" opacity="0.9"/>

  <!--
    Broken orbital arc — the "orbit" half of the mark.
    Open at the TOP (not the right) to avoid Google-G memory.
    Asymmetric: the arc sweeps from lower-left (240°) to right (350°),
    leaving a wide gap across the top through which the edge vector enters.
  -->
  <path
    d="M 95 311 A 161 161 0 1 0 414 290"
    fill="none"
    stroke="url(#gse-edge-grad)"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!--
    Edge vector — diagonal of advantage.
    Enters from upper-left at 17°, crosses the orbital plane through the
    signal point, exits lower-right. Slightly offset from the absolute
    diagonal so it doesn't bisect the orbit symmetrically.
  -->
  <line
    x1="90"
    y1="146"
    x2="446"
    y2="362"
    stroke="url(#gse-edge-grad)"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- Signal point glow halo -->
  <circle cx="272" cy="246" r="64" fill="url(#gse-signal-glow)"/>

  <!--
    Signal point — the memory hook.
    Solid ion-magenta dot, sized to read at favicon scale.
    Positioned slightly above/right of center to anchor the asymmetry.
  -->
  <circle cx="272" cy="246" r="22" fill="#FF2DD6"/>
  <circle cx="272" cy="246" r="9"  fill="#F6F7FA"/>
</svg>
