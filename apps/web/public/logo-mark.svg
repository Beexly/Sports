<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Galaxy signal mark">
  <title>Galaxy Sports Network</title>
  <defs>
    <radialGradient id="g-bg" cx="50%" cy="42%" r="64%">
      <stop offset="0%"  stop-color="#0F1424"/>
      <stop offset="60%" stop-color="#070A11"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <radialGradient id="g-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FF2DD6" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#7A5CFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Carbon background, social-avatar safe area -->
  <rect width="512" height="512" rx="104" fill="url(#g-bg)"/>

  <!-- Split orbital ring -->
  <circle cx="256" cy="256" r="144" fill="none" stroke="#00E5FF" stroke-width="40"
          stroke-linecap="round" stroke-dasharray="348 104" transform="rotate(20 256 256)"/>

  <!-- Core glow halo -->
  <circle cx="256" cy="256" r="120" fill="url(#g-core-glow)"/>

  <!-- Edge blade slicing through -->
  <polygon points="400,112 270.7,270.7 112,400 241.3,241.3" fill="#F6F7FA"/>

  <!-- Signal core + ping -->
  <circle cx="256" cy="256" r="35" fill="#FF2DD6"/>
  <circle cx="360" cy="136" r="18" fill="#7A5CFF"/>
</svg>
