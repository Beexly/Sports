<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Galaxy Sports Edge favicon — orbit + signal + edge.
    Designed to read at 16×16. The signal point is the memory hook;
    the orbit is intentionally broken at the top to avoid any
    circular-letter resemblance.
  -->
  <rect width="64" height="64" rx="12" fill="#050608"/>

  <!-- Broken orbital arc -->
  <path
    d="M 12 39 A 20 20 0 1 0 52 36"
    fill="none"
    stroke="#FF2DD6"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Edge vector — diagonal -->
  <line x1="11" y1="18" x2="56" y2="46"
        stroke="#00E5FF"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Signal point — the memory hook -->
  <circle cx="34" cy="30" r="4.5" fill="#FF2DD6"/>
  <circle cx="34" cy="30" r="1.8" fill="#F6F7FA"/>
</svg>
