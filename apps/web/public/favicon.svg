<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Galaxy signal mark — the 2026 brand-family symbol (Galaxy Sports Edge + Network).
    A bold split orbital ring (open so it never reads as a coin), a sharp edge
    blade slicing through it, a signal core at the crossing, and a ping. Built to
    read at 16x16: the ring silhouette + the blade are the memory hooks.
  -->
  <rect width="64" height="64" rx="14" fill="#05070B"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#00E5FF" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="43.5 13" transform="rotate(20 32 32)"/>
  <polygon points="50,14 33.84,33.84 14,50 30.16,30.16" fill="#F5F7FF"/>
  <circle cx="32" cy="32" r="4.4" fill="#FF38C7"/>
  <circle cx="45" cy="17" r="2.3" fill="#7B61FF"/>
</svg>
