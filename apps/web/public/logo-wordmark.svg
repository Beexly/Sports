<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96" width="480" height="96" role="img" aria-label="PickPilot wordmark">
  <title>PickPilot</title>

  <!-- "PICKPIL" -->
  <text x="0" y="68" fill="#EDF2F7"
        font-family="'Syne', 'Space Grotesk', system-ui, sans-serif"
        font-weight="800"
        font-size="64"
        letter-spacing="-2">PICKPIL</text>

  <!-- Reticle replacing the "O" -->
  <g transform="translate(286, 32)">
    <circle cx="32" cy="32" r="30" fill="none" stroke="#FF2D8A" stroke-width="3"/>
    <circle cx="32" cy="32" r="16" fill="none" stroke="#FF2D8A" stroke-width="2" opacity="0.5"/>
    <line x1="32" y1="-2" x2="32" y2="10" stroke="#FF2D8A" stroke-width="3"/>
    <line x1="32" y1="54" x2="32" y2="66" stroke="#FF2D8A" stroke-width="3"/>
    <line x1="-2" y1="32" x2="10" y2="32" stroke="#FF2D8A" stroke-width="3"/>
    <line x1="54" y1="32" x2="66" y2="32" stroke="#FF2D8A" stroke-width="3"/>
    <circle cx="32" cy="32" r="4" fill="#FF2D8A"/>
  </g>

  <!-- "T" -->
  <text x="358" y="68" fill="#EDF2F7"
        font-family="'Syne', 'Space Grotesk', system-ui, sans-serif"
        font-weight="800"
        font-size="64"
