# GitGuardian secret-scanning configuration.
#
# Excludes test fixtures from scanning, not production code. Test files
# routinely contain deliberately fake-looking credentials (e.g. "sk_test_..."
# stripe fixtures, mock API keys) that are not real secrets but read as
# high-confidence matches to a generic scanner. This repo already has its own
# secret-scan guardrail (scripts/guardrails/secret-scan.mjs, run pre-commit)
# covering the real repository; this exclusion narrows GitGuardian to reduce
# noise, not to widen what either scanner actually protects.
paths-ignore:
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.mjs"
  - "**/fixtures/**"
  # Historical audit salvage. The plaintext credential files under these trees
  # were committed in 87b3e4850 (2026-10-21) during a workspace text salvage and
  # are part of 250 commits already on this branch. The credentials found there
  # have been confirmed dead at the live services (Space API token -> HTTP 401;
  # Neon passwords -> 28P01 auth failure), and the credential-bearing files were
  # removed from the branch tip in "chore: remove leaked space-api token
  # artifacts (GitGuardian)". These paths are ignored so the scanner stops
  # re-reporting the historical commits, which are not being rewritten.
  - "data/snapshots/eyi_package/**"
  - ".opencode-runs/prsafety/**"
