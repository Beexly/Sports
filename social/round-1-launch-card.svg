<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Galaxy Sports Edge — Find the signal before the market moves.">
  <!--
    Round 1 launch card — Galaxy Sports Edge
    Export: open this file in any browser, screenshot at 1080x1080,
    or open in Figma/Illustrator/Inkscape and export as PNG.
    Or upload directly to Canva (File → Import → SVG) and export there.
    Square format, brand-pack spec.

    Color: Brand Use Pack §4
      Obsidian Black  #050608
      Ion White       #F6F7FA
      Orbital Cyan    #00E5FF
      Ion Magenta     #FF2DD6
      Soft Ultraviolet #7A5CFF
  -->

  <defs>
    <!-- Radial cosmic gradient — UV upper-left → magenta lower-right -->
    <radialGradient id="cosmic-ul" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#7A5CFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cosmic-lr" cx="100%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#FF2DD6" stop-opacity="0.40"/>
      <stop offset="35%" stop-color="#7A5CFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
    <!-- Star sprinkles -->
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6F7FA" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F6F7FA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Obsidian canvas -->
  <rect width="1080" height="1080" fill="#050608"/>

  <!-- Cosmic gradients -->
  <rect width="1080" height="1080" fill="url(#cosmic-ul)"/>
  <rect width="1080" height="1080" fill="url(#cosmic-lr)"/>

  <!-- Subtle horizon hairline -->
  <line x1="0" y1="690" x2="1080" y2="690" stroke="#F6F7FA" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Reference stars -->
  <circle cx="180" cy="220" r="1.2" fill="#F6F7FA" fill-opacity="0.55"/>
  <circle cx="320" cy="160" r="0.9" fill="#F6F7FA" fill-opacity="0.40"/>
  <circle cx="860" cy="190" r="1.3" fill="#F6F7FA" fill-opacity="0.60"/>
  <circle cx="940" cy="320" r="0.8" fill="#F6F7FA" fill-opacity="0.35"/>
  <circle cx="120" cy="780" r="1.0" fill="#F6F7FA" fill-opacity="0.50"/>
  <circle cx="960" cy="880" r="1.4" fill="#F6F7FA" fill-opacity="0.55"/>
  <circle cx="240" cy="920" r="0.9" fill="#F6F7FA" fill-opacity="0.40"/>

  <!-- One bright signal anchor — top-right -->
  <circle cx="880" cy="280" r="3" fill="#FF2DD6"/>
  <circle cx="880" cy="280" r="22" fill="none" stroke="#FF2DD6" stroke-opacity="0.30" stroke-width="1"/>

  <!-- Orbital mark + wordmark, centered -->
  <g transform="translate(540 460)">
    <!-- Orbital glyph -->
    <g transform="translate(-280 -40)">
      <!-- Outer orbit -->
      <path d="M 8 60 A 32 32 0 1 0 72 56" fill="none" stroke="#F6F7FA" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Diagonal vector -->
      <line x1="4" y1="14" x2="76" y2="78" stroke="#F6F7FA" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Signal sphere -->
      <circle cx="46" cy="40" r="6.5" fill="#FF2DD6"/>
      <circle cx="46" cy="40" r="14" fill="none" stroke="#FF2DD6" stroke-opacity="0.4" stroke-width="1"/>
    </g>

    <!-- "GALAXY" -->
    <text x="-180" y="20" font-family="'Exo 2', 'Helvetica Neue', Impact, sans-serif"
          font-weight="800" font-size="92" letter-spacing="13" fill="#F6F7FA">GALAXY</text>
    <!-- "SPORTS EDGE" -->
    <text x="-180" y="72" font-family="'Exo 2', 'Helvetica Neue', Arial, sans-serif"
          font-weight="500" font-size="34" letter-spacing="13" fill="#00E5FF">SPORTS EDGE</text>
  </g>

  <!-- Eyebrow — Live Edge Engine -->
  <g transform="translate(540 620)" text-anchor="middle">
    <circle cx="-200" cy="-7" r="6" fill="#FF2DD6"/>
    <text x="-186" y="0" font-family="'JetBrains Mono', Menlo, monospace"
          font-weight="500" font-size="18" letter-spacing="4.2" fill="#7A5CFF">LIVE EDGE ENGINE</text>
  </g>

  <!-- Tagline — locked brand H1 -->
  <text x="540" y="760" text-anchor="middle"
        font-family="'Exo 2', 'Helvetica Neue', Impact, sans-serif"
        font-weight="700" font-size="56" fill="#F6F7FA" letter-spacing="-1.2">
    Find the signal
  </text>
  <text x="540" y="822" text-anchor="middle"
        font-family="'Exo 2', 'Helvetica Neue', Impact, sans-serif"
        font-weight="700" font-size="56" fill="#F6F7FA" letter-spacing="-1.2">
    before the market moves.
  </text>

  <!-- Footer — founder anchor -->
  <line x1="160" y1="940" x2="920" y2="940" stroke="#00E5FF" stroke-opacity="0.22" stroke-width="1"/>
  <text x="540" y="980" text-anchor="middle"
        font-family="'JetBrains Mono', Menlo, monospace"
        font-weight="500" font-size="18" letter-spacing="4.2" fill="#8089A0">
    BUILT BY GARRETT BAXLEY · FOUNDER
  </text>
  <text x="540" y="1014" text-anchor="middle"
        font-family="'JetBrains Mono', Menlo, monospace"
        font-weight="500" font-size="16" letter-spacing="3.6" fill="#00E5FF">
    GALAXYSPORTSEDGE.COM
  </text>
</svg>
