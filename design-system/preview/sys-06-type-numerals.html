<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Numerals · PickPilot</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--void); }
  .card {
    width: 700px; min-height: 280px;
    padding: 24px 26px;
    background:
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(255, 45, 138,0.05), transparent 70%),
      radial-gradient(ellipse 40% 30% at 90% 90%, rgba(155,123,250,0.04), transparent 70%),
      linear-gradient(180deg, var(--obsidian) 0%, var(--carbon) 100%);
    color: var(--fg-1);
    box-sizing: border-box;
  }
  .eyebrow {
    font: 500 10px/1 var(--f-mono);
    text-transform: uppercase; letter-spacing: 0.22em;
    color: var(--fg-muted); margin: 0 0 4px;
  }
  .eyebrow .dot { color: var(--plasma); }
  .title {
    font: 600 18px/1.2 var(--f-display);
    color: var(--fg); letter-spacing: -0.01em;
    margin: 0 0 18px;
  }
  .row {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr 1.1fr;
    gap: 16px;
    margin-bottom: 18px;
  }
  .cell {
    border: 1px solid var(--mineral);
    background: var(--obsidian);
    border-radius: var(--r-md);
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .label {
    font: 500 9px/1 var(--f-mono);
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--fg-muted);
  }
  .num {
    font-family: var(--f-numerals);
    font-variant-numeric: tabular-nums;
    color: var(--ion-white);
    letter-spacing: -0.02em;
  }
  .conf  { font: 700 56px/1 var(--f-numerals); color: var(--plasma); letter-spacing: -0.03em; }
  .conf .pct { color: var(--fg-meta); font-size: 22px; margin-left: 2px; }
  .edge  { font: 700 56px/1 var(--f-numerals); color: var(--ion-white); letter-spacing: -0.03em; }
  .line  { font: 600 36px/1 var(--f-numerals); color: var(--ion); }
  .delta { font: 500 18px/1 var(--f-numerals); }
  .delta .up   { color: var(--verify); }
  .delta .down { color: var(--alert); }
  .move {
    display: flex; align-items: center; gap: 6px;
    font: 500 12px/1 var(--f-mono); color: var(--fg-meta);
  }
  .move b { color: var(--verify); font-weight: 600; }

  .ticker {
    border-top: 1px solid var(--mineral);
    padding-top: 14px;
    display: flex; gap: 28px; align-items: center;
    font: 500 12px/1 var(--f-mono);
    color: var(--ion-1);
    letter-spacing: 0.12em;
  }
  .ticker .v { color: var(--ion-white); }
  .ticker .s { color: var(--signal); }
  .ticker .a { color: var(--ion-blue); }
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow"><span class="dot">●</span> TYPE / 02 — DATA NUMERALS</p>
  <h2 class="title">JetBrains Mono · tabular · numbers are heroes</h2>
  <div class="row">
    <div class="cell">
      <span class="label">Confidence</span>
      <span class="conf">81<span class="pct">%</span></span>
    </div>
    <div class="cell">
      <span class="label">Edge Score</span>
      <span class="edge">72</span>
    </div>
    <div class="cell">
      <span class="label">Line</span>
      <span class="line">−2.5</span>
    </div>
    <div class="cell">
      <span class="label">Movement</span>
      <span class="delta"><span class="up">↑</span> 5.0 pts</span>
      <span class="move">From open · <b>sharp</b></span>
    </div>
  </div>
  <div class="ticker">
    <span>LAKERS <span class="v">−4.5</span></span>
    <span>O/U <span class="v">219.5</span></span>
    <span>ML <span class="v">−175</span> / <span class="v">+148</span></span>
    <span>EDGE <span style="color:var(--plasma)">+72</span></span>
    <span>RISK <span class="a">MOD</span></span>
  </div>
</div>
</body>
</html>
