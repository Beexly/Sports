<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo lockup · PickPilot</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--void); }
  .card {
    width: 700px; min-height: 260px;
    padding: 26px 28px;
    background:
      radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255, 45, 138,0.07), transparent 65%),
      linear-gradient(180deg, var(--obsidian) 0%, var(--carbon) 100%);
    color: var(--fg-1);
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255, 45, 138,0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 45, 138,0.025) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    pointer-events: none;
  }
  .eyebrow { font: 500 10px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.22em; color: var(--fg-muted); margin: 0 0 4px; position: relative; }
  .eyebrow .dot { color: var(--plasma); }
  .title { font: 600 18px/1.2 var(--f-display); color: var(--fg); letter-spacing: -0.01em; margin: 0 0 26px; position: relative; }

  .lock { display: flex; align-items: center; justify-content: center; margin-bottom: 22px; position: relative; }
  .wordmark {
    display: inline-flex; align-items: baseline;
    font-family: var(--f-arch);
    font-weight: 900;
    font-size: 76px;
    line-height: 0.9;
    letter-spacing: -0.04em;
    color: var(--ion-white);
    white-space: nowrap;
    text-transform: uppercase;
  }
  .wordmark .ret {
    display: inline-block;
    position: relative;
    width: 0.78em;
    height: 0.78em;
    align-self: center;
    margin: 0 -0.04em;
    transform: translateY(0.05em);
    color: var(--plasma);
    filter: drop-shadow(0 0 12px rgba(255, 45, 138,0.4));
  }
  .wordmark .ret svg { width: 100%; height: 100%; }

  .scale-row { display: flex; gap: 24px; align-items: center; justify-content: center; position: relative; }
  .mini {
    border: 1px solid var(--mineral);
    border-radius: var(--r-sm);
    padding: 12px 16px;
    background: var(--obsidian);
    display: flex; flex-direction: column; gap: 6px; align-items: center;
  }
  .mini .lbl { font: 500 9px/1 var(--f-mono); letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg-muted); }
  .mini .m1 svg { width: 40px; height: 40px; color: var(--plasma); }
  .mini .m2 svg { width: 24px; height: 24px; color: var(--plasma); }
  .mini .m3 svg { width: 16px; height: 16px; color: var(--plasma); }
  .mini .wm-mini {
    font-family: var(--f-arch);
    font-weight: 900;
    font-size: 20px;
    letter-spacing: -0.03em;
    color: var(--ion-white);
    text-transform: uppercase;
    display: inline-flex; align-items: baseline;
  }
  .mini .wm-mini .ret {
    width: 0.78em; height: 0.78em;
    color: var(--plasma);
    margin: 0 -0.04em;
    transform: translateY(0.05em);
    align-self: center;
  }
  .mini .wm-mini .ret svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="card">
  <div class="grid-bg"></div>
  <p class="eyebrow"><span class="dot">●</span> BRAND / 01 — LOGO LOCKUP</p>
  <h2 class="title">The reticle replaces the &ldquo;o&rdquo; in Pilot</h2>

  <div class="lock">
    <span class="wordmark">
      PICKPIL
      <span class="ret">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt">
          <circle cx="24" cy="24" r="22"/>
          <circle cx="24" cy="24" r="12" opacity="0.5"/>
          <line x1="24" y1="-2" x2="24" y2="8"/>
          <line x1="24" y1="40" x2="24" y2="50"/>
          <line x1="-2" y1="24" x2="8" y2="24"/>
          <line x1="40" y1="24" x2="50" y2="24"/>
          <circle cx="24" cy="24" r="3" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      T
    </span>
  </div>

  <div class="scale-row">
    <div class="mini">
      <div class="m1">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4">
          <circle cx="24" cy="24" r="22"/><circle cx="24" cy="24" r="12" opacity="0.45"/>
          <line x1="24" y1="-2" x2="24" y2="8"/><line x1="24" y1="40" x2="24" y2="50"/>
          <line x1="-2" y1="24" x2="8" y2="24"/><line x1="40" y1="24" x2="50" y2="24"/>
          <circle cx="24" cy="24" r="3" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <span class="lbl">Mark · 40px</span>
    </div>
    <div class="mini">
      <span class="wm-mini">PP<span class="ret"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4"><circle cx="24" cy="24" r="22"/><line x1="24" y1="-2" x2="24" y2="8"/><line x1="24" y1="40" x2="24" y2="50"/><line x1="-2" y1="24" x2="8" y2="24"/><line x1="40" y1="24" x2="50" y2="24"/><circle cx="24" cy="24" r="3" fill="currentColor" stroke="none"/></svg></span></span>
      <span class="lbl">App icon</span>
    </div>
    <div class="mini">
      <div class="m3">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"><circle cx="24" cy="24" r="22"/><line x1="-2" y1="24" x2="8" y2="24"/><line x1="40" y1="24" x2="50" y2="24"/><line x1="24" y1="-2" x2="24" y2="8"/><line x1="24" y1="40" x2="24" y2="50"/><circle cx="24" cy="24" r="4" fill="currentColor" stroke="none"/></svg>
      </div>
      <span class="lbl">Favicon · 16px</span>
    </div>
  </div>
</div>
</body>
</html>
