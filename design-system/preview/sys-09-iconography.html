<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iconography · PickPilot</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--void); }
  .card {
    width: 700px; min-height: 220px;
    padding: 22px 24px;
    background:
      radial-gradient(ellipse 50% 40% at 18% 30%, rgba(255, 45, 138,0.07), transparent 65%),
      linear-gradient(180deg, var(--obsidian) 0%, var(--carbon) 100%);
    color: var(--fg-1);
    box-sizing: border-box;
  }
  .eyebrow { font: 500 10px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.22em; color: var(--fg-muted); margin: 0 0 4px; }
  .eyebrow .dot { color: var(--plasma); }
  .title { font: 600 18px/1.2 var(--f-display); color: var(--fg); letter-spacing: -0.01em; margin: 0 0 20px; }

  .row { display: grid; grid-template-columns: 220px 1fr; gap: 22px; align-items: stretch; }

  .reticle {
    border: 1px solid var(--mineral);
    border-radius: var(--r-md);
    padding: 16px;
    background: var(--obsidian);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    position: relative;
  }
  .reticle .ret {
    width: 92px; height: 92px;
    color: var(--plasma);
    filter: drop-shadow(0 0 12px rgba(255, 45, 138,0.4));
  }
  .reticle .ret svg { width: 100%; height: 100%; }
  .reticle .lbl { font: 500 9px/1 var(--f-mono); letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg-muted); }
  .reticle .nm { font: 600 13px/1.1 var(--f-display); color: var(--fg); }

  .icons {
    border: 1px solid var(--mineral);
    border-radius: var(--r-md);
    padding: 16px 18px;
    background: var(--obsidian);
    display: flex; flex-direction: column; gap: 12px;
  }
  .icons .sub { font: 500 9px/1 var(--f-mono); letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg-muted); }
  .glyphs { display: flex; gap: 14px; flex-wrap: wrap; }
  .gl {
    width: 38px; height: 38px;
    border: 1px solid var(--mineral);
    border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
    color: var(--ion);
  }
  .gl svg { width: 18px; height: 18px; }
  .data-glyphs { display: flex; gap: 18px; font: 500 22px/1 var(--f-numerals); color: var(--ion); }
  .data-glyphs span { display: inline-flex; align-items: center; gap: 6px; }
  .data-glyphs .lbl { font: 500 9px/1 var(--f-mono); letter-spacing: 0.18em; color: var(--fg-muted); text-transform: uppercase; }
  .data-glyphs .up { color: var(--verify); }
  .data-glyphs .down { color: var(--alert); }
  .data-glyphs .mid { color: var(--plasma); }
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow"><span class="dot">●</span> ICONOGRAPHY / 01 — MARK + GLYPHS</p>
  <h2 class="title">One custom mark · Lucide line set · unicode for data</h2>

  <div class="row">
    <div class="reticle">
      <div class="ret">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="24" cy="24" r="22"/>
          <circle cx="24" cy="24" r="12" opacity="0.45"/>
          <line x1="24" y1="-2" x2="24" y2="8"/>
          <line x1="24" y1="40" x2="24" y2="50"/>
          <line x1="-2" y1="24" x2="8" y2="24"/>
          <line x1="40" y1="24" x2="50" y2="24"/>
          <circle cx="24" cy="24" r="3" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <span class="lbl">PickPilot mark</span>
      <span class="nm">The Reticle</span>
    </div>

    <div class="icons">
      <span class="sub">Lucide · 1.5px stroke · current-color</span>
      <div class="glyphs" style="color:var(--ion)">
        <span class="gl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>
        <span class="gl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></span>
        <span class="gl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg></span>
        <span class="gl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <span class="gl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg></span>
        <span class="gl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
        <span class="gl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6z"/></svg></span>
        <span class="gl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>
      </div>

      <span class="sub" style="margin-top:4px">Data glyphs · unicode only</span>
      <div class="data-glyphs">
        <span><span class="up">↑</span><span class="lbl">UP</span></span>
        <span><span class="down">↓</span><span class="lbl">DN</span></span>
        <span><span class="mid">−</span><span class="lbl">NEG ODDS</span></span>
        <span><span class="mid">·</span><span class="lbl">SEP</span></span>
        <span><span class="mid">→</span><span class="lbl">NAV</span></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
